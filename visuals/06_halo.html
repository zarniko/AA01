<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>halo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      min-height: 100vh;
      font-family: 'Roboto Mono', monospace;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, #0d0800 0%, #000 70%);
      z-index: 0;
    }

    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .scanline {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
      pointer-events: none;
      z-index: 2;
    }

    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
      z-index: 3;
    }

    #btn {
      all: unset;
      position: fixed;
      top: 20px;
      left: 24px;
      z-index: 4;
      font-family: 'Roboto Mono', monospace;
      font-size: 14px;
      color: #39ff14;
      letter-spacing: 3px;
      cursor: pointer;
    }

    #tgkeys {
      position: fixed;
      top: 54px;
      left: 24px;
      z-index: 4;
      font-family: 'Roboto Mono', monospace;
      font-size: 14px;
      letter-spacing: 3px;
      color: #39ff14;
      display: flex;
      gap: 1ch;
    }
    #tkey { cursor: pointer; }
    #hud-cv {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4;
    }
    #grain-cv {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    #zko {
      position: fixed;
      bottom: 20px;
      left: 24px;
      z-index: 4;
      font-family: 'Roboto Mono', monospace;
      font-size: 14px;
      letter-spacing: 3px;
      color: #39ff14;
      text-decoration: none;
      cursor: pointer;
    }

    #ops {
      position: fixed;
      top: 20px;
      right: 24px;
      z-index: 4;
      font-family: 'Roboto Mono', monospace;
      font-size: 14px;
      letter-spacing: 3px;
      color: #39ff14;
    }

    #speed {
      position: fixed;
      top: 40px;
      right: 24px;
      z-index: 4;
      font-family: 'Roboto Mono', monospace;
      font-size: 14px;
      letter-spacing: 3px;
      color: #39ff14;
      user-select: none;
    }
    #speed span { cursor: pointer; }

    #legend {
      position: fixed;
      bottom: 20px;
      right: 24px;
      z-index: 4;
      font-family: 'Roboto Mono', monospace;
      font-size: 14px;
      display: grid;
      grid-template-columns: repeat(8, 1em);
      gap: 4px 6px;
      line-height: 1.4;
      text-align: center;
    }

    #ckey {
      position: fixed;
      bottom: 67px;
      right: 24px;
      width: 1em;
      z-index: 4;
      font-family: 'Roboto Mono', monospace;
      font-size: 14px;
      line-height: 1.4;
      color: #39ff14;
      text-align: center;
      pointer-events: none;
    }
    #dbg {
    position: fixed; bottom: 20px; left: 100px; z-index: 6;
    font-family: 'Roboto Mono', monospace; font-size: 14px;
    letter-spacing: 3px; color: #39ff14; pointer-events: none; white-space: nowrap;
  }
</style>
</head>
<body>

  <div class="scanline"></div>
  <div class="vignette"></div>
  <canvas id="canvas"></canvas>
  <canvas id="hud-cv"></canvas>
  <button id="btn"></button>
  <div id="tgkeys"><div id="tkey">T</div></div>
  <canvas id="grain-cv"></canvas>
  <div id="ops"></div>
  <div id="speed"><span id="slower">&lt;</span> <span id="faster">&gt;</span></div>
  <div id="legend"></div>
  <div id="ckey">C</div>
  <a id="zko" href="https://zko.io" target="_blank" rel="noopener"></a>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx    = canvas.getContext('2d');
    const hudCv  = document.getElementById('hud-cv');
    const hudCtx = hudCv.getContext('2d');
    const btn    = document.getElementById('btn');

    // ── random char helpers ───────────────────────────────────
    const POOL = '.,:;+*#@0123456789';
    const rc   = () => POOL[Math.floor(Math.random() * POOL.length)];
    const rb = () => String.fromCodePoint(0x2801 + Math.floor(Math.random() * 255));

    // ── top-right random label ────────────────────────────────
    const opsEl = document.getElementById('ops');
    opsEl.textContent = rc()+rc()+rc()+rc();

    // ── VGA 16-color legend ───────────────────────────────────
    const VGA = [
      '#000000','#0000AA','#00AA00','#00AAAA',
      '#AA0000','#AA00AA','#AA5500','#AAAAAA',
      '#555555','#5555FF','#55FF55','#55FFFF',
      '#FF5555','#FF55FF','#FFFF55','#FFFFFF',
    ];
    const legendEl = document.getElementById('legend');
    const tkeyEl   = document.getElementById('tkey');

    // Halo tint — VGA click (no C) shifts the center color
    let tintR = 1, tintG = 1, tintB = 1;
    let colorIdx = 10;
    let uiColorIdx = 10;

    function setHaloTint(hex) {
      tintR = parseInt(hex.slice(1,3),16) / 255;
      tintG = parseInt(hex.slice(3,5),16) / 255;
      tintB = parseInt(hex.slice(5,7),16) / 255;
      tkeyEl.style.color = hex;
    }

    let cHeld = false;
    window.addEventListener('keydown', e => { if (e.key === 'c' || e.key === 'C') cHeld = true; });
    window.addEventListener('keyup',   e => { if (e.isTrusted) window.parent?.postMessage({ type: 'childKeyup', key: e.key }, '*'); if (e.key === 'c' || e.key === 'C') cHeld = false; });

    const legendSpans = VGA.map(col => {
      const s = document.createElement('span');
      s.style.color  = col;
      s.style.cursor = 'pointer';
      s.textContent  = rc();
      s.addEventListener('click', () => {
        if (cHeld) {
          btn.style.color   = col;
          opsEl.style.color = col;
          zkoEl.style.color = col;
          document.getElementById('ckey').style.color   = col;
          document.getElementById('tgkeys').style.color = col;
          document.getElementById('speed').style.color  = col;
        } else {
          setHaloTint(col);
        }
      });
      legendEl.appendChild(s);
      return s;
    });

    // ── bottom-left zko.io link ───────────────────────────────
    const zkoEl = document.getElementById('zko');
    zkoEl.textContent = rc()+rc()+rc()+rc();

    let cycleMs = 140;
    function cycleFn() {
      btn.textContent   = rb();
      opsEl.textContent = rc()+rc()+rc()+rc();
      zkoEl.textContent = rc()+rc()+rc()+rc();
      legendSpans.forEach(s => s.textContent = rc());
    }
    let cycleId = setInterval(cycleFn, cycleMs);
    function updateSpeedUI() {
      const sl = document.getElementById('slower');
      const fa = document.getElementById('faster');
      sl.style.opacity       = cycleMs >= 560 ? '0.4' : '1';
      sl.style.pointerEvents = cycleMs >= 560 ? 'none' : '';
      fa.style.opacity       = cycleMs <= 140 ? '0.4' : '1';
      fa.style.pointerEvents = cycleMs <= 140 ? 'none' : '';
    }
    updateSpeedUI();
    document.getElementById('slower').addEventListener('click', () => {
      cycleMs = Math.min(560, cycleMs + 140);
      clearInterval(cycleId);
      cycleId = setInterval(cycleFn, cycleMs);
      updateSpeedUI();
    });
    document.getElementById('faster').addEventListener('click', () => {
      cycleMs = Math.max(140, cycleMs - 140);
      clearInterval(cycleId);
      cycleId = setInterval(cycleFn, cycleMs);
      updateSpeedUI();
    });
    window.addEventListener('keydown', e => {
      if (e.isTrusted) window.parent?.postMessage({ type: 'childKey', key: e.key, shiftKey: !!e.shiftKey }, '*');
      if (e.key === 'ArrowLeft' && !cHeld) {
        cycleMs = Math.min(560, cycleMs + 140);
        clearInterval(cycleId);
        cycleId = setInterval(cycleFn, cycleMs);
        updateSpeedUI();
      } else if (e.key === 'ArrowRight' && !cHeld) {
        cycleMs = Math.max(140, cycleMs - 140);
        clearInterval(cycleId);
        cycleId = setInterval(cycleFn, cycleMs);
        updateSpeedUI();
      } else if (!cHeld && e.key === 'ArrowUp') {
        colorIdx = (colorIdx - 1 + VGA.length) % VGA.length;
        setHaloTint(VGA[colorIdx]);
      } else if (!cHeld && e.key === 'ArrowDown') {
        colorIdx = (colorIdx + 1) % VGA.length;
        setHaloTint(VGA[colorIdx]);
      } else if (cHeld && e.key === 'ArrowUp') {
        uiColorIdx = (uiColorIdx - 1 + VGA.length) % VGA.length;
        btn.style.color   = VGA[uiColorIdx];
        opsEl.style.color = VGA[uiColorIdx];
        zkoEl.style.color = VGA[uiColorIdx];
        document.getElementById('ckey').style.color   = VGA[uiColorIdx];
        document.getElementById('tgkeys').style.color = VGA[uiColorIdx];
        document.getElementById('speed').style.color  = VGA[uiColorIdx];
      } else if (cHeld && e.key === 'ArrowDown') {
        uiColorIdx = (uiColorIdx + 1) % VGA.length;
        btn.style.color   = VGA[uiColorIdx];
        opsEl.style.color = VGA[uiColorIdx];
        zkoEl.style.color = VGA[uiColorIdx];
        document.getElementById('ckey').style.color   = VGA[uiColorIdx];
        document.getElementById('tgkeys').style.color = VGA[uiColorIdx];
        document.getElementById('speed').style.color  = VGA[uiColorIdx];
      }
    });

    // ── canvas resize ─────────────────────────────────────────
    // Render at 20% of viewport — CSS scales it back to 100%
    const SCALE = 0.2;
    let _imgData = null;

    // Per-column precomputed arc data (re-filled on resize)
    let arcPyArr  = new Float32Array(1);
    let ntArrCol  = new Float32Array(1);
    let edgeBAArr = new Float32Array(1);
    let validCol  = new Uint8Array(1);

    function resize() {
      hudCv.width   = window.innerWidth;
      hudCv.height  = window.innerHeight;
      canvas.width  = Math.round(window.innerWidth  * SCALE);
      canvas.height = Math.round(window.innerHeight * SCALE);
      const W = canvas.width, H = canvas.height;

      arcPyArr  = new Float32Array(W);
      ntArrCol  = new Float32Array(W);
      edgeBAArr = new Float32Array(W);
      validCol  = new Uint8Array(W);

      // Straight horizontal beam at vertical center
      const arcY = H * 0.5;

      for (let px = 0; px < W; px++) {
        const nt = (px - W / 2) / (W / 2);  // -1 at left edge, +1 at right edge
        ntArrCol[px]  = nt;
        arcPyArr[px]  = arcY;
        edgeBAArr[px] = Math.min(1, nt * nt * 0.4);
        validCol[px]  = 1;
      }
    }
    window.addEventListener('resize', resize);
    resize();

    // ── audio state ───────────────────────────────────────────
    let analyser   = null;
    let timeDomain = null;
    let micActive  = false;
    let micStream  = null;
    let audioCtx   = null;
    let ampBoost    = 0;  // extra brightness from mic/T key, decays over time
    let pulseTarget = 0;  // smooth target for click / T organic growth
    let ampSmooth   = 0;  // eased envelope (no sudden bounce)
    let parentAudio = null;
    let glitchPulse = 0;  // drives beam reaction to glitch events

    // ── render ───────────────────────────────────────────────
    let startTime = null;

    // Shuffled base color palette + slow per-blob hue drift (no fixed order)
    const HALO_PAL = [
      [0.08, 0.32, 0.72], // deep cobalt blue
      [0.12, 0.65, 0.74], // soft cyan-teal
      [0.96, 0.56, 0.08], // warm amber-gold
      [0.88, 0.18, 0.10], // velvety crimson-orange
      [0.68, 0.20, 0.52], // soft rose-violet
    ];
    for (let i = HALO_PAL.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [HALO_PAL[i], HALO_PAL[j]] = [HALO_PAL[j], HALO_PAL[i]];
    }
    const BLOB_OFFS = Array.from({ length: 5 }, (_, i) => i + Math.random() * 0.5);

    function sampleHaloPal(pos) {
      const n  = HALO_PAL.length;
      const p  = ((pos % n) + n) % n;
      const i0 = p | 0, i1 = (i0 + 1) % n, f = p - i0;
      const c0 = HALO_PAL[i0], c1 = HALO_PAL[i1];
      return [
        c0[0] + (c1[0] - c0[0]) * f,
        c0[1] + (c1[1] - c0[1]) * f,
        c0[2] + (c1[2] - c0[2]) * f,
      ];
    }

    function render(ts) {
      if (!startTime) startTime = ts;
      const t = (ts - startTime) / 1000;

      // Smooth organic attack & slow release (no sudden snap/bounce)
      glitchPulse *= 0.90;
      pulseTarget *= 0.985;
      const rawLevel = Math.min(1.2, Math.max(ampBoost * 1.6, pulseTarget));
      ampSmooth += (rawLevel - ampSmooth) * (rawLevel > ampSmooth ? 0.045 : 0.025);

      const W = canvas.width, H = canvas.height;
      const minDim     = Math.min(W, H);
      const soundLevel = ampSmooth;
      const growFar    = 1 + soundLevel * 0.22;
      const growMid    = 1 + soundLevel * 0.45;
      const growNear   = 1 + soundLevel * 0.65;
      const bright     = 0.85 + soundLevel * 0.35;

      if (!_imgData || _imgData.width !== W || _imgData.height !== H) {
        _imgData = ctx.createImageData(W, H);
      }
      const data = _imgData;
      const pix  = data.data;
      pix.fill(0);

      // 5 flowing, domain-warped light-leak ribbons across 3 depth layers (no circular shapes, no hard cutoffs)
      const blobs = [
        // Far deep ambient wash
        {
          bx: W * (0.30 + 0.04 * Math.sin(t * 0.09)),
          by: H * (0.42 + 0.04 * Math.cos(t * 0.11)),
          rot: 0.38 + 0.08 * Math.sin(t * 0.08),
          sx: minDim * 0.42 * growFar,
          sy: minDim * 0.18 * growFar,
          warp: 0.35,
          ridge: 0.75,
          halo: 0.30,
          col: sampleHaloPal(BLOB_OFFS[0] + t * 0.03),
          amp: 0.34 * bright,
        },
        {
          bx: W * (0.72 + 0.04 * Math.cos(t * 0.10 + 1.4)),
          by: H * (0.58 + 0.04 * Math.sin(t * 0.12 + 0.8)),
          rot: -0.42 + 0.08 * Math.cos(t * 0.09),
          sx: minDim * 0.40 * growFar,
          sy: minDim * 0.17 * growFar,
          warp: 0.35,
          ridge: 0.75,
          halo: 0.30,
          col: sampleHaloPal(BLOB_OFFS[3] + t * 0.03),
          amp: 0.32 * bright,
        },
        // Midground flowing light-leaks (crisp luminous ridge + soft mist)
        {
          bx: W * (0.24 + 0.04 * Math.sin(t * 0.15)),
          by: H * (0.30 + 0.04 * Math.cos(t * 0.18)),
          rot: -0.55 + 0.12 * Math.sin(t * 0.13),
          sx: minDim * 0.28 * growMid,
          sy: minDim * 0.09 * growMid,
          warp: 0.42,
          ridge: 1.55,
          halo: 0.40,
          col: sampleHaloPal(BLOB_OFFS[1] + t * 0.04),
          amp: 0.80 * bright,
        },
        {
          bx: W * (0.52 + 0.04 * Math.cos(t * 0.16 + 1.1)),
          by: H * (0.52 + 0.04 * Math.sin(t * 0.15 + 0.8)),
          rot: 0.32 + 0.10 * Math.sin(t * 0.14),
          sx: minDim * 0.30 * growMid,
          sy: minDim * 0.085 * growMid,
          warp: 0.45,
          ridge: 1.65,
          halo: 0.42,
          col: sampleHaloPal(BLOB_OFFS[2] + t * 0.035),
          amp: 0.86 * bright,
        },
        {
          bx: W * (0.78 + 0.04 * Math.sin(t * 0.14 + 2.2)),
          by: H * (0.34 + 0.04 * Math.cos(t * 0.17 + 1.5)),
          rot: 1.05 + 0.12 * Math.cos(t * 0.15),
          sx: minDim * 0.26 * growMid,
          sy: minDim * 0.08 * growMid,
          warp: 0.40,
          ridge: 1.60,
          halo: 0.40,
          col: sampleHaloPal(BLOB_OFFS[4] + t * 0.045),
          amp: 0.78 * bright,
        },
        // Foreground sharp accent wisp
        {
          bx: W * (0.36 + 0.05 * Math.cos(t * 0.22 + 0.6)),
          by: H * (0.72 + 0.04 * Math.sin(t * 0.24 + 1.3)),
          rot: -0.30 + 0.15 * Math.sin(t * 0.19),
          sx: minDim * 0.20 * growNear,
          sy: minDim * 0.055 * growNear,
          warp: 0.48,
          ridge: 2.10,
          halo: 0.45,
          col: sampleHaloPal(BLOB_OFFS[1] + t * 0.055 + 1.8),
          amp: 0.70 * bright,
        },
      ].map(b => ({ ...b, cosR: Math.cos(b.rot), sinR: Math.sin(b.rot), invSx: 1 / b.sx, invSy: 1 / b.sy }));

      for (let py = 0; py < H; py++) {
        const rowOff = py * W * 4;

        for (let px = 0; px < W; px++) {
          let rAcc = 0, gAcc = 0, bAcc = 0;

          for (let bi = 0; bi < blobs.length; bi++) {
            const bl = blobs[bi];
            const dx = px - bl.bx;
            const dy = py - bl.by;
            const lx =  dx * bl.cosR + dy * bl.sinR;
            const ly = -dx * bl.sinR + dy * bl.cosR;
            const u  = lx * bl.invSx;
            const v  = ly * bl.invSy;
            if (u * u + v * v > 16.0) continue; // < 0.0001 intensity, zero visible edge

            const wu = u + bl.warp * Math.sin(v * 1.4 + t * 0.28 + bi * 1.7);
            const wv = v + bl.warp * Math.cos(u * 1.6 - t * 0.24 + bi * 1.3);
            const d2 = wu * wu + wv * wv;
            if (d2 > 14.0) continue;

            const wCore = Math.exp(-d2 * bl.ridge);
            const wHalo = 0.34 * Math.exp(-d2 * bl.halo);
            const w     = bl.amp * (wCore + wHalo);
            const cMix  = Math.min(1, wCore * 0.45);
            rAcc += (bl.col[0] * (1 - cMix) + cMix) * w;
            gAcc += (bl.col[1] * (1 - cMix) + cMix) * w;
            bAcc += (bl.col[2] * (1 - cMix) + cMix) * w;
          }

          if (rAcc < 0.004 && gAcc < 0.004 && bAcc < 0.004) continue;

          // Subtle VGA tint blend + soft filmic curve (keeps rich midtones, no harsh white clipping)
          const r  = 1 - Math.exp(-(rAcc * 0.88 + tintR * 0.12 * rAcc) * 1.15);
          const g  = 1 - Math.exp(-(gAcc * 0.88 + tintG * 0.12 * gAcc) * 1.15);
          const b  = 1 - Math.exp(-(bAcc * 0.88 + tintB * 0.12 * bAcc) * 1.15);

          const idx    = rowOff + px * 4;
          pix[idx]     = (r * 255) | 0;
          pix[idx + 1] = (g * 255) | 0;
          pix[idx + 2] = (b * 255) | 0;
          pix[idx + 3] = 255;
        }
      }

      ctx.putImageData(data, 0, 0);
      drawHaloAnnotations(blobs, t, W, H, minDim, soundLevel);
    }

    function drawHaloAnnotations(blobs, t, W, H, minDim, soundLevel) {
      const vw = hudCv.width, vh = hudCv.height;
      const sx = vw / W, sy = vh / H;
      const col = VGA[uiColorIdx] || '#39ff14';
      hudCtx.clearRect(0, 0, vw, vh);
      hudCtx.save();
      hudCtx.strokeStyle  = col;
      hudCtx.fillStyle    = col;
      hudCtx.shadowColor  = col;
      hudCtx.font         = '11px "Roboto Mono", monospace';
      hudCtx.textBaseline = 'middle';

      const targets = [
        { bi: 2, uOff:  0.15, fn: bl => `r ${bl.ridge.toFixed(1)}  w ${bl.warp.toFixed(2)}` },
        { bi: 3, uOff: -0.15, fn: bl => `θ ${bl.rot.toFixed(2)}  a ${bl.amp.toFixed(2)}` },
        { bi: 4, uOff:  0.15, fn: (bl, bi) => `φ ${(bl.warp * Math.sin(t * 0.28 + bi * 1.7)).toFixed(2)}` },
      ];

      const placedTips = [];
      for (const { bi, uOff, fn } of targets) {
        const bl = blobs[bi];
        if (!bl) continue;
        const lx = uOff * bl.sx;
        const ax = (bl.bx + lx * bl.cosR) * sx;
        const ay = (bl.by + lx * bl.sinR) * sy;

        // Point leader slightly inward from outer edges so it never clips off-screen
        let nx = (vw * 0.5 - ax) * 0.35 + (bi % 2 ? 18 : -18);
        let ny = (vh * 0.5 - ay) * 0.35 + (ay < vh * 0.5 ? 24 : -24);
        const nL = Math.hypot(nx, ny) || 1;
        nx /= nL; ny /= nL;

        const lead = 34 + soundLevel * 12;
        const tx   = Math.max(70, Math.min(vw - 70, ax + nx * lead));
        let   ty   = Math.max(40, Math.min(vh - 40, ay + ny * lead));
        for (const pt of placedTips) {
          if (Math.abs(tx - pt.x) < 130 && Math.abs(ty - pt.y) < 26) {
            ty = Math.max(40, Math.min(vh - 40, pt.y + (ty >= pt.y ? 28 : -28)));
          }
        }
        placedTips.push({ x: tx, y: ty });

        // Anchor dot on ribbon
        hudCtx.setLineDash([]);
        hudCtx.shadowBlur  = 0;
        hudCtx.globalAlpha = 0.85;
        hudCtx.beginPath();
        hudCtx.arc(ax, ay, 2.0, 0, Math.PI * 2);
        hudCtx.fill();

        // Dotted leader line
        hudCtx.setLineDash([4, 5]);
        hudCtx.lineDashOffset = -t * 16;
        hudCtx.lineWidth   = 0.8;
        hudCtx.globalAlpha = 0.55 + soundLevel * 0.25;
        hudCtx.beginPath();
        hudCtx.moveTo(ax, ay);
        hudCtx.lineTo(tx, ty);
        hudCtx.stroke();

        // Tip cross
        hudCtx.setLineDash([]);
        hudCtx.lineWidth   = 1.2;
        hudCtx.globalAlpha = 0.78;
        hudCtx.beginPath();
        hudCtx.moveTo(tx - 6, ty); hudCtx.lineTo(tx + 6, ty);
        hudCtx.moveTo(tx, ty - 6); hudCtx.lineTo(tx, ty + 6);
        hudCtx.stroke();

        // Compact single-line math annotation aligned inward
        const inwardRight = tx < vw * 0.55;
        hudCtx.textAlign   = inwardRight ? 'left' : 'right';
        const lxTxt = tx + (inwardRight ? 10 : -10);
        hudCtx.shadowBlur  = 0;
        hudCtx.globalAlpha = 0.76;
        hudCtx.fillText(fn(bl, bi), lxTxt, ty);
      }

      hudCtx.restore();
    }

    // ── idle ─────────────────────────────────────────────────
    // D: audio debug readout (rms, bass, avg, sd, dev, beat, amp) next to the zko link
    const _dbg = { rms: 0, b: 0, avg: 0, sd: 0, dev: 0, beat: 0 };
    let _dbgEl = null;
    window.addEventListener('keydown', e => {
      if ((e.key !== 'd' && e.key !== 'D') || e.metaKey || e.ctrlKey || e.altKey) return;
      if (_dbgEl) { _dbgEl.remove(); _dbgEl = null; return; }
      _dbgEl = document.createElement('div'); _dbgEl.id = 'dbg'; document.body.appendChild(_dbgEl);
      (function tick() {
        if (!_dbgEl) return;
        const z = document.getElementById('zko');
        _dbgEl.textContent = `${_dbg.rms.toFixed(3)} ${_dbg.b.toFixed(0)} ${_dbg.avg.toFixed(0)} ${_dbg.sd.toFixed(1)} ${_dbg.dev.toFixed(1)} ${_dbg.beat.toFixed(2)} ${(typeof ampBoost === 'number' ? ampBoost : 0).toFixed(2)}`;
        if (z && z.style.color) _dbgEl.style.color = z.style.color;
        requestAnimationFrame(tick);
      })();
    });

    // Bass-band beat detector (same as 32_julia): bass level vs its ~1s running mean, scaled by the music's own variation.
    // Level-invariant, so steady speaker->mic music still produces pulses. Returns 0..1.
    let _fBuf = null, _bAvg = -1, _bVar = 16, _bWarm = 0, _bLast = 0;
    function beatLevel() {
      let f, binHz;
      if (micActive && analyser) {
        if (!_fBuf || _fBuf.length !== analyser.frequencyBinCount) _fBuf = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(_fBuf); f = _fBuf; binHz = audioCtx.sampleRate / analyser.fftSize;
      } else if (parentAudio && parentAudio.freqData) {
        f = parentAudio.freqData; binHz = 24000 / f.length;
      } else { _bAvg = -1; return 0; }
      const now = performance.now();
      if (now - _bLast > 500) _bAvg = -1;     // stream (re)started
      _bLast = now;
      const lo = Math.max(1, Math.round(50 / binHz)), hi = Math.max(lo, Math.round(200 / binHz));
      let b = 0;
      for (let k = lo; k <= hi; k++) b += f[k];
      b /= (hi - lo + 1);
      if (_bAvg < 0) { _bAvg = b; _bVar = 16; _bWarm = 40; return 0; }   // warm-up skips analyser start-up ramp
      const dev = b - _bAvg;
      _bAvg += dev * 0.015;
      _bVar += (dev * dev - _bVar) * 0.015;
      if (_bWarm > 0) { _bWarm--; return 0; }
      const sd = Math.sqrt(_bVar);
      const _bt = Math.max(0, Math.min(1, (dev - Math.max(3, sd * 0.8)) / Math.max(8, sd * 1.7)));
      _dbg.b = b; _dbg.avg = _bAvg; _dbg.sd = sd; _dbg.dev = dev; _dbg.beat = _bt;
      return _bt;
    }

    function idleTick(ts) {
      if (parentAudio) {
        const rms = Math.max(parentAudio.rms, beatLevel() * 0.1);
        _dbg.rms = rms;
        ampBoost += (rms * 2.5 - ampBoost) * 0.15;
        if (rms > 0.04) triggerPulse();
      } else {
        ampBoost *= 0.92;
      }
      render(ts);
    }

    // ── mic ──────────────────────────────────────────────────
    function micTick(ts) {
      analyser.getByteTimeDomainData(timeDomain);

      let sumSq = 0;
      for (let i = 0; i < timeDomain.length; i++) {
        const d = timeDomain[i] / 255 - 0.5;
        sumSq += d * d;
      }
      const rms = Math.max(Math.sqrt(sumSq / timeDomain.length), beatLevel() * 0.1);
      _dbg.rms = rms;

      ampBoost += (rms * 2.5 - ampBoost) * 0.15;
      if (rms > 0.04) triggerPulse();
      render(ts);
    }

    // ── loop ─────────────────────────────────────────────────
    let _lastLoopTs = 0;
    function loop(ts) {
      requestAnimationFrame(loop);
      if (ts - _lastLoopTs < 20) return;
      _lastLoopTs = ts;
      micActive ? micTick(ts) : idleTick(ts);
    }

    // ── T key / click: organic growth pulse ───────────────────
    function triggerPulse() {
      pulseTarget = Math.min(1.2, Math.max(pulseTarget, 0.35) + 0.45);
    }
    window.addEventListener('keydown', e => { if (e.key === 't' || e.key === 'T') triggerPulse(); });
    document.getElementById('tkey').addEventListener('click', triggerPulse);
    canvas.addEventListener('click', triggerPulse);

    // ── Grain ────────────────────────────────────────────────
    let grainOn  = true;
    const grainEl = document.getElementById('grain-cv');
    const grainCx = grainEl.getContext('2d');
    let grainImg  = null;
    function drawGrainFrame() {
      if (!grainOn) return;
      const gW = Math.ceil(window.innerWidth  / 2);
      const gH = Math.ceil(window.innerHeight / 2);
      if (grainEl.width !== gW || grainEl.height !== gH) {
        grainEl.width  = gW;
        grainEl.height = gH;
        grainImg = grainCx.createImageData(gW, gH);
      }
      const data = grainImg.data;
      for (let i = 0; i < data.length; i += 4) {
        const v = Math.random() * 255 | 0;
        data[i] = data[i+1] = data[i+2] = v;
        data[i+3] = Math.random() * 30 | 0;
      }
      grainCx.putImageData(grainImg, 0, 0);
      requestAnimationFrame(drawGrainFrame);
    }
    function toggleGrain() {
      grainOn = !grainOn;
      if (grainOn) drawGrainFrame();
    }
    window.addEventListener('keydown', e => { if (e.key === 'g' || e.key === 'G') toggleGrain(); });
    drawGrainFrame();

    // ── mic toggle ───────────────────────────────────────────
    btn.addEventListener('click', async () => {
      if (micActive) {
        micActive = false;
        btn.style.opacity = '0.4';
        micStream?.getTracks().forEach(t => t.stop());
        audioCtx?.close();
        micStream = audioCtx = analyser = timeDomain = null;
        ampBoost  = 0;
        return;
      }
      try {
        micStream  = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false }, video: false });
        audioCtx   = new (window.AudioContext || window.webkitAudioContext)();
        const src  = audioCtx.createMediaStreamSource(micStream);
        analyser   = audioCtx.createAnalyser();
        analyser.fftSize               = 2048;
        analyser.smoothingTimeConstant = 0.2;
        src.connect(analyser);
        timeDomain = new Uint8Array(analyser.fftSize);
        micActive  = true;
        btn.style.opacity = '';
      } catch { /* permission denied */ }
    });

    // Randomize colors on load
    (function() {
      const GOOD = [6,11,13,14,15];
      colorIdx  = GOOD[Math.floor(Math.random() * GOOD.length)];
      setHaloTint(VGA[colorIdx]);
      const _uiPool = GOOD.filter(i => i !== colorIdx);
      uiColorIdx = _uiPool[Math.floor(Math.random() * _uiPool.length)];
      const _uc = VGA[uiColorIdx];
      if (btn)   btn.style.color   = _uc;
      if (opsEl) opsEl.style.color = _uc;
      if (zkoEl) zkoEl.style.color = _uc;
      const _ck = document.getElementById('ckey');
      const _tk = document.getElementById('tgkeys');
      const _sp = document.getElementById('speed');
      if (_ck) _ck.style.color = _uc;
      if (_tk) _tk.style.color = _uc;
      if (_sp) _sp.style.color = _uc;
    })();

    requestAnimationFrame(loop);

  // ── postMessage bridge (keyboard from parent window) ──────────
  window.addEventListener('message', e => {
    if (e.data?.type === 'key') {
      if (e.data.cHeld !== undefined) cHeld = !!e.data.cHeld;
      window.dispatchEvent(new KeyboardEvent('keydown', {key:e.data.key, shiftKey:!!e.data.shiftKey, bubbles:true}));
    }
    else if (e.data?.type === 'keyup')
      window.dispatchEvent(new KeyboardEvent('keyup', {key:e.data.key, bubbles:true}));
    else if (e.data?.type === 'audioData')
      parentAudio = e.data;
  });
</script>
</body>
</html>
