<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Automata</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Share Tech Mono', monospace;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, #080808 0%, #000 70%);
    z-index: 0;
  }
  #canvas {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: block;
  }
  .scanline {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
    pointer-events: none;
    z-index: 2;
  }
  .vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    z-index: 3;
  }
  #btn {
    all: unset;
    position: fixed;
    top: 20px;
    left: 24px;
    z-index: 4;
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    color: #39ff14;
    letter-spacing: 3px;
    cursor: pointer;
  }
  #legend {
    position: fixed;
    top: 20px;
    right: 24px;
    z-index: 4;
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    display: grid;
    grid-template-columns: repeat(8, 1em);
    gap: 4px 6px;
    line-height: 1.4;
    text-align: center;
  }
  #zko {
    position: fixed;
    bottom: 20px;
    left: 24px;
    z-index: 4;
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    letter-spacing: 3px;
    color: #39ff14;
    text-decoration: none;
    cursor: pointer;
  }
  #ops {
    position: fixed;
    bottom: 20px;
    right: 24px;
    z-index: 4;
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    letter-spacing: 3px;
    color: #39ff14;
  }
  #speed {
    position: fixed;
    bottom: 40px;
    right: 24px;
    z-index: 4;
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    letter-spacing: 3px;
    color: #39ff14;
    user-select: none;
  }
  #speed span { cursor: pointer; }
  #tgkeys {
    position: fixed;
    top: 54px;
    left: 24px;
    z-index: 4;
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    letter-spacing: 3px;
    color: #39ff14;
    display: flex;
    gap: 1ch;
  }
  #tkey { cursor: pointer; }
  #grain-cv {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 5;
  }
  #ckey {
    position: fixed;
    top: 68px;
    right: 24px;
    width: 1em;
    z-index: 4;
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    line-height: 1.4;
    color: #39ff14;
    text-align: center;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="scanline"></div>
<div class="vignette"></div>
<button id="btn"></button>
<div id="tgkeys"><div id="tkey">T</div></div>
<div id="legend"></div>
<div id="ops"></div>
<div id="speed"><span id="slower">&lt;</span> <span id="faster">&gt;</span></div>
<div id="ckey">C</div>
<a id="zko" href="https://zko.io" target="_blank" rel="noopener"></a>
<canvas id="grain-cv"></canvas>
<canvas id="canvas"></canvas>
<script>
  const canvas  = document.getElementById('canvas');
  const ctx     = canvas.getContext('2d');
  const _offCv  = document.createElement('canvas');
  const _offCtx = _offCv.getContext('2d');

  let W, H, SUN_R, SUN_CX, SUN_CY;

  let _bgGrad, _crGrad, _bloomGrad, _sgGrad, _limbGrad;

  function buildGradients() {
    _bgGrad = ctx.createRadialGradient(SUN_CX, SUN_CY, SUN_R*0.6, SUN_CX, SUN_CY, Math.max(W,H)*1.5);
    _bgGrad.addColorStop(0,'#0d0d0d'); _bgGrad.addColorStop(0.25,'#050505'); _bgGrad.addColorStop(1,'#000000');

    _crGrad = ctx.createRadialGradient(SUN_CX, SUN_CY, SUN_R*0.95, SUN_CX, SUN_CY, SUN_R*2.6);
    _crGrad.addColorStop(0,'rgba(255,255,255,0.38)'); _crGrad.addColorStop(0.15,'rgba(220,220,220,0.18)');
    _crGrad.addColorStop(0.40,'rgba(150,150,150,0.07)'); _crGrad.addColorStop(0.70,'rgba(80,80,80,0.02)');
    _crGrad.addColorStop(1,'rgba(0,0,0,0)');

    _bloomGrad = ctx.createRadialGradient(SUN_CX, SUN_CY, SUN_R*0.2, SUN_CX, SUN_CY, SUN_R*2.4);
    _bloomGrad.addColorStop(0,'rgba(255,255,255,0.14)'); _bloomGrad.addColorStop(0.35,'rgba(200,200,200,0.10)');
    _bloomGrad.addColorStop(0.70,'rgba(120,120,120,0.04)'); _bloomGrad.addColorStop(1,'rgba(0,0,0,0)');

    _sgGrad = ctx.createRadialGradient(SUN_CX-SUN_R*0.12, SUN_CY-SUN_R*0.20, SUN_R*0.04, SUN_CX, SUN_CY, SUN_R);
    _sgGrad.addColorStop(0,'#ffffff'); _sgGrad.addColorStop(0.12,'#f4f4f4');
    _sgGrad.addColorStop(0.35,'#cccccc'); _sgGrad.addColorStop(0.65,'#666666');
    _sgGrad.addColorStop(0.88,'#282828'); _sgGrad.addColorStop(1,'#080808');

    _limbGrad = ctx.createRadialGradient(SUN_CX, SUN_CY, SUN_R*0.87, SUN_CX, SUN_CY, SUN_R*1.04);
    _limbGrad.addColorStop(0,'rgba(255,255,255,0)'); _limbGrad.addColorStop(0.65,'rgba(230,230,230,0.22)');
    _limbGrad.addColorStop(1,'rgba(255,255,255,0)');
  }

  function resize() {
    W = canvas.width = _offCv.width = window.innerWidth;
    H = canvas.height = _offCv.height = window.innerHeight;
    SUN_R  = Math.min(W, H) * 0.302;
    SUN_CX = W / 2;
    SUN_CY = H * 0.5;
    buildGradients();
  }
  window.addEventListener('resize', resize);

  // ── Helpers ───────────────────────────────────────────────
  const POOL = '.,:;+*#@0123456789';
  const rc = () => POOL[Math.floor(Math.random() * POOL.length)];
  const rb = () => String.fromCodePoint(0x2801 + Math.floor(Math.random() * 255));

  const VGA = [
    '#000000','#0000AA','#00AA00','#00AAAA',
    '#AA0000','#AA00AA','#AA5500','#AAAAAA',
    '#555555','#5555FF','#55FF55','#55FFFF',
    '#FF5555','#FF55FF','#FFFF55','#FFFFFF',
  ];

  // Pre-cached rgb strings and trig constants
  const _rgb  = Array.from({length: 256}, (_, i) => `rgb(${i},${i},${i})`);
  const cosE  = Math.cos(0.38), sinE = Math.sin(0.38);

  // ── State ─────────────────────────────────────────────────
  let cycleMs    = 140;
  let lineColor  = '#FFFF55';
  let colorIdx   = 14;
  let uiColorIdx = 13;
  let ampLevel   = 0;
  let ampWasHigh = false;
  let sunAngle   = 0;
  let sphereRot  = 0;

  // Cross state
  const crossAngles       = new Float64Array(4);
  const crossTargetAngles = new Float64Array(4);
  let lastCrossRotTs   = 0;
  let lastCrossIndivTs = 0;
  let crossBlink       = 0;

  // ── Audio ─────────────────────────────────────────────────
  let micActive = false, micStream = null, audioCtx = null, analyser = null, timeDomain = null;
  let parentAudio = null;

  // ── Bezier helper ─────────────────────────────────────────
  function bezPt(t, a, b, c, d) {
    const mt = 1 - t;
    return mt*mt*mt*a + 3*mt*mt*t*b + 3*mt*t*t*c + t*t*t*d;
  }

  // ── Flares ────────────────────────────────────────────────
  const flares = [];
  const MAX_FLARES = 14;

  function mkFlare() {
    // Flare origin: on the 2D silhouette circle (edge looks best for particles)
    const theta = Math.random() * Math.PI * 2;
    const bx = SUN_CX + SUN_R * Math.sin(theta);
    const by = SUN_CY - SUN_R * Math.cos(theta);
    const nx = Math.sin(theta), ny = -Math.cos(theta);

    const isLoop = Math.random() < 0.40;
    let p1x, p1y, p2x, p2y, ex, ey;

    if (isLoop) {
      const dT = (0.2 + Math.random() * 0.6) * (Math.random() < 0.5 ? 1 : -1);
      const t2 = theta + dT;
      ex = SUN_CX + SUN_R * Math.sin(t2);
      ey = SUN_CY - SUN_R * Math.cos(t2);
      const h = SUN_R * (0.10 + Math.random() * 0.42);
      p1x = bx + nx * h + (Math.random()-0.5)*h*0.3;
      p1y = by + ny * h + (Math.random()-0.5)*h*0.3;
      p2x = ex + Math.sin(t2)*h + (Math.random()-0.5)*h*0.3;
      p2y = ey - Math.cos(t2)*h + (Math.random()-0.5)*h*0.3;
    } else {
      const h    = SUN_R * (0.20 + Math.random() * 0.95);
      const curl = (Math.random() - 0.5) * h * 0.65;
      p1x = bx + nx*h*0.30 - ny*curl*0.2;
      p1y = by + ny*h*0.30 + nx*curl*0.2;
      p2x = bx + nx*h*0.72 - ny*curl;
      p2y = by + ny*h*0.72 + nx*curl;
      ex  = bx + nx*h      - ny*curl*1.6;
      ey  = by + ny*h      + nx*curl*1.6;
    }

    // Axis annotation: placed at a 3D point on the sphere face at the same latitude
    // as the flare's vertical position on the edge, at a random front-hemisphere longitude.
    // cos(theta) maps to the latitude ring at that height.
    const sinPhi = Math.max(-0.97, Math.min(0.97, Math.cos(theta) / cosE));
    const axLat  = Math.asin(sinPhi);
    const axLng  = 0.12 + Math.random() * (Math.PI - 0.24); // front hemisphere
    const acLat  = Math.cos(axLat), asLat = Math.sin(axLat);
    const acLng  = Math.cos(axLng), asLng = Math.sin(axLng);
    const ax3dX  = SUN_CX + SUN_R * acLat * acLng;
    const ax3dY  = SUN_CY - SUN_R * (asLat * cosE - acLat * asLng * sinE);
    const axNxR  = ax3dX - SUN_CX, axNyR = ax3dY - SUN_CY;
    const axNLen = Math.sqrt(axNxR*axNxR + axNyR*axNyR) || 1;
    const ax3dNx = axNxR / axNLen, ax3dNy = axNyR / axNLen;

    const N = 100 + Math.floor(Math.random() * 80);
    return {
      bx, by, p1x, p1y, p2x, p2y, ex, ey, isLoop, nx, ny,
      hasAxis:  Math.random() < 0.5,
      label:    String(10 + Math.floor(Math.random() * 90)),
      ax3dX, ax3dY, ax3dNx, ax3dNy, // 3D annotation point on sphere face
      particles: Array.from({ length: N }, () => ({
        t:   Math.random(),
        spd: 0.04 + Math.random() * 0.10,
        sz:  0.22 + Math.random() * 0.85,
      })),
      streamers:  [],
      spawnTimer: 0,
      born:    performance.now(),
      maxLife: 4000 + Math.random() * 7000,
    };
  }

  // ── Surface granules ──────────────────────────────────────
  const granules = Array.from({ length: 80 }, () => ({
    theta: (Math.random() - 0.5) * Math.PI * 1.55,
    dr:    Math.random() * 0.06,
    sz:    1 + Math.random() * 2.5,
    b:     0.3 + Math.random() * 0.7,
    ph:    Math.random() * Math.PI * 2,
    spd:   0.4 + Math.random() * 1.5,
  }));

  // ── Trigger ───────────────────────────────────────────────
  function triggerBurst() {
    for (let i = 0; i < 3; i++) flares.push(mkFlare());
    crossBlink = 1.0;
  }

  // ── Render ────────────────────────────────────────────────
  let lastTs = null;

  function frame(ts) {
    if (!lastTs) { lastTs = ts; requestAnimationFrame(frame); return; }
    const elapsed = ts - lastTs;
    if (elapsed < 15) { requestAnimationFrame(frame); return; } // cap ~66fps, halves work on 120Hz
    const dt = Math.min(elapsed / 1000, 0.05);
    lastTs = ts;
    sphereRot += dt * 0.12;

    // Audio
    if (micActive || parentAudio) {
      let rms;
      if (micActive) {
        analyser.getByteTimeDomainData(timeDomain);
        let sq = 0;
        for (let k = 0; k < timeDomain.length; k++) {
          const d = timeDomain[k] / 255 - 0.5; sq += d * d;
        }
        rms = Math.sqrt(sq / timeDomain.length);
      } else { rms = parentAudio.rms; }
      ampLevel += (rms * 5 - ampLevel) * 0.1;
      if (rms > 0.06 && !ampWasHigh) { triggerBurst(); ampWasHigh = true; }
      else if (rms < 0.03) ampWasHigh = false;
    } else { ampLevel *= 0.95; }

    const speedMult = 140 / cycleMs;

    // Cross rotation (all 90° CCW every 6s, random individual CW every 18s)
    crossBlink *= 0.88;
    if (ts - lastCrossRotTs > 6000) {
      for (let i = 0; i < 4; i++) crossTargetAngles[i] -= Math.PI / 2;
      lastCrossRotTs = ts;
    }
    if (ts - lastCrossIndivTs > 18000) {
      crossTargetAngles[Math.floor(Math.random() * 4)] += Math.PI / 2;
      lastCrossIndivTs = ts;
    }
    for (let i = 0; i < 4; i++) crossTargetAngles[i] -= ampLevel * 0.18; // audio spins crosses
    for (let i = 0; i < 4; i++) crossAngles[i] += (crossTargetAngles[i] - crossAngles[i]) * 0.08;

    ctx.clearRect(0, 0, W, H);

    // Space background
    ctx.fillStyle = _bgGrad; ctx.fillRect(0, 0, W, H);

    // Outer corona
    ctx.fillStyle = _crGrad; ctx.fillRect(0, 0, W, H);

    // Bloom halo
    ctx.fillStyle = _bloomGrad; ctx.fillRect(0, 0, W, H);

    // Sun body
    ctx.beginPath();
    ctx.arc(SUN_CX, SUN_CY, SUN_R, 0, Math.PI * 2);
    ctx.fillStyle = _sgGrad;
    ctx.fill();

    // 3D grid + surface granules (clipped to sphere)
    ctx.save();
    ctx.beginPath();
    ctx.arc(SUN_CX, SUN_CY, SUN_R * 0.997, 0, Math.PI * 2);
    ctx.clip();

    // Latitude rings (correct perspective ellipses for elevation 0.38 rad)
    ctx.lineWidth = 0.8;
    ctx.strokeStyle = '#aaaaaa';
    ctx.globalAlpha = 0.40;
    for (let i = 1; i <= 7; i++) {
      const phi = -Math.PI / 2 + i * Math.PI / 8;
      const lcy = SUN_CY - SUN_R * Math.sin(phi) * cosE;
      const lrx = SUN_R * Math.cos(phi);
      const lry = lrx * sinE;
      if (lry < 1) continue;
      ctx.beginPath();
      ctx.ellipse(SUN_CX, lcy, lrx, lry, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Longitude lines — front-facing half only, rotated with sphereRot
    ctx.globalAlpha = 0.42;
    for (let j = 0; j < 12; j++) {
      const lng  = j * Math.PI / 6;
      const lngS = lng + sphereRot;
      const cosL = Math.cos(lngS), sinL = Math.sin(lngS);
      if (Math.abs(sinL) < 0.02) continue;
      ctx.beginPath();
      let gpStarted = false;
      for (let k = 0; k <= 30; k++) {
        const t    = -Math.PI / 2 + k * Math.PI / 30;
        const cosT = Math.cos(t), sinT = Math.sin(t);
        if (cosT * sinL <= 0) { gpStarted = false; continue; }
        const gx2d = SUN_CX + SUN_R * cosT * cosL;
        const gy2d = SUN_CY + SUN_R * (-sinT * cosE + cosT * sinL * sinE);
        if (!gpStarted) { ctx.moveTo(gx2d, gy2d); gpStarted = true; }
        else ctx.lineTo(gx2d, gy2d);
      }
      ctx.stroke();
    }

    // Surface granules
    for (const g of granules) {
      const p  = 0.55 + 0.45 * Math.sin(ts * 0.001 * g.spd + g.ph);
      const b  = g.b * p;
      const r  = SUN_R * (1 - g.dr);
      const gx = SUN_CX + r * Math.sin(g.theta);
      const gy = SUN_CY - r * Math.cos(g.theta);
      ctx.globalAlpha = b * 0.65;
      const gv = (130 + 125 * b) | 0;
      ctx.fillStyle = `rgb(${gv},${gv},${gv})`;
      ctx.beginPath();
      ctx.arc(gx, gy, g.sz, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // Flares → offscreen canvas
    _offCtx.clearRect(0, 0, W, H);
    const now = performance.now();
    for (let fi = flares.length - 1; fi >= 0; fi--) {
      const f = flares[fi];
      const lifeT = (now - f.born) / f.maxLife;
      if (lifeT >= 1) { flares.splice(fi, 1); continue; }
      const env = Math.min(1, lifeT * 4) * Math.min(1, (1 - lifeT) * 4);
      const ampBoost1 = 1 + ampLevel * 1.8;
      const ampBoost2 = 1 + ampLevel * 0.8;
      for (const p of f.particles) {
        p.t = (p.t + p.spd * dt * speedMult * (1 + ampLevel * 1.5)) % 1;
        const ht    = f.isLoop ? Math.sin(p.t * Math.PI) : p.t;
        const heat  = 1 - ht * 0.65;
        const pathA = Math.min(1, p.t * 10) * Math.min(1, (1 - p.t) * 10);
        const alpha = Math.min(1, pathA * env * (0.32 + 0.58 * heat) * ampBoost2);
        if (alpha < 0.01) continue; // skip invisible particles (~20% fewer draw calls)
        const px = bezPt(p.t, f.bx, f.p1x, f.p2x, f.ex);
        const py = bezPt(p.t, f.by, f.p1y, f.p2y, f.ey);
        const fv    = Math.min(255, (100 + 155 * heat + ampLevel * 80) | 0);
        _offCtx.globalAlpha = alpha;
        _offCtx.fillStyle = _rgb[fv];
        _offCtx.beginPath();
        _offCtx.arc(px, py, p.sz * ampBoost1, 0, Math.PI * 2);
        _offCtx.fill();
      }

      // Streamers — subtle particles following the flare's bezier path
      f.spawnTimer += dt * speedMult;
      const spawnInterval = 0.09 / (1 + ampLevel * 1.5);
      while (f.spawnTimer >= spawnInterval) {
        f.spawnTimer -= spawnInterval;
        if (f.streamers.length < 50) // cap per-flare to prevent unbounded growth
          f.streamers.push({
            t:    0,
            spd:  0.018 + Math.random() * 0.045,
            maxT: 0.45  + Math.random() * 0.45,
            sz:   0.25  + Math.random() * 0.55,
          });
      }
      // compact-in-place: O(1) removal instead of splice O(n)
      let sLen = 0;
      for (let si = 0; si < f.streamers.length; si++) {
        const s = f.streamers[si];
        s.t += s.spd * dt * speedMult * (1 + ampLevel * 1.0);
        if (s.t >= s.maxT) continue; // dead — don't keep
        const prog   = s.t / s.maxT;
        const sAlpha = Math.min(1, prog * 14) * Math.pow(1 - prog, 1.8);
        const sA     = Math.min(1, sAlpha * env * 0.45 * (1 + ampLevel * 0.5));
        if (sA >= 0.01) { // skip invisible streamers
          const sx   = bezPt(s.t, f.bx, f.p1x, f.p2x, f.ex);
          const sy   = bezPt(s.t, f.by, f.p1y, f.p2y, f.ey);
          const sv   = Math.min(255, (80 + 90 * (1 - prog) + ampLevel * 50) | 0);
          const ssz  = s.sz * (1 - prog * 0.5) * ampBoost2;
          _offCtx.globalAlpha = sA;
          _offCtx.fillStyle = _rgb[sv];
          _offCtx.beginPath();
          _offCtx.arc(sx, sy, Math.max(0.1, ssz), 0, Math.PI * 2);
          _offCtx.fill();
        }
        f.streamers[sLen++] = s; // keep alive streamer
      }
      f.streamers.length = sLen;
    }
    while (flares.length < MAX_FLARES) flares.push(mkFlare());

    // Composite flares: direct composite, no blur
    ctx.drawImage(_offCv, 0, 0);

    // Axis lines with tip labels at half of flare origins
    ctx.save();
    ctx.font         = '14px "Share Tech Mono", monospace';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle  = lineColor;
    ctx.lineWidth    = 0.7;
    ctx.shadowColor  = lineColor;
    ctx.shadowBlur   = 8;
    ctx.setLineDash([5, 5]);
    ctx.lineDashOffset = -ts * 0.012;
    let crossIdx = 0;
    for (const f of flares) {
      if (!f.hasAxis) continue;
      const fLT = (now - f.born) / f.maxLife;
      if (fLT >= 1) continue;
      const fEnv = Math.min(1, fLT * 4) * Math.min(1, (1 - fLT) * 4);
      // Axis starts at the 3D sphere-surface annotation point, extends outward
      const axExtend = SUN_R * 0.32;
      const axEndX   = f.ax3dX + f.ax3dNx * axExtend;
      const axEndY   = f.ax3dY + f.ax3dNy * axExtend;
      const cxX      = f.ax3dX + f.ax3dNx * (axExtend + 18);
      const cxY      = f.ax3dY + f.ax3dNy * (axExtend + 18);
      const lblX     = f.ax3dX + f.ax3dNx * (axExtend + 40);
      const lblY     = f.ax3dY + f.ax3dNy * (axExtend + 40);
      ctx.globalAlpha = fEnv * 0.70;
      ctx.beginPath();
      ctx.moveTo(f.ax3dX, f.ax3dY);
      ctx.lineTo(axEndX, axEndY);
      ctx.stroke();
      ctx.shadowBlur  = 0;
      ctx.setLineDash([]);
      ctx.globalAlpha = fEnv * 0.85;
      ctx.fillStyle   = lineColor;
      ctx.fillText(f.label, lblX, lblY);
      // Cross at clearance position for up to 4 axis flares
      if (crossIdx < 4) {
        ctx.save();
        ctx.lineWidth   = 1.5;
        ctx.shadowBlur  = 5;
        ctx.globalAlpha = fEnv * (0.62 + crossBlink * 0.38);
        ctx.translate(cxX, cxY);
        ctx.rotate(crossAngles[crossIdx++]);
        ctx.beginPath();
        ctx.moveTo(-9, 0); ctx.lineTo(9, 0);
        ctx.moveTo(0, -9); ctx.lineTo(0, 9);
        ctx.stroke();
        ctx.restore();
      }
      ctx.shadowBlur     = 8;
      ctx.setLineDash([5, 5]);
    }
    ctx.shadowBlur  = 0;
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    ctx.restore();

    // Limb brightening ring
    ctx.beginPath();
    ctx.arc(SUN_CX, SUN_CY, SUN_R * 1.04, 0, Math.PI * 2);
    ctx.fillStyle = _limbGrad;
    ctx.fill();

    requestAnimationFrame(frame);
  }

  // ── Init ──────────────────────────────────────────────────
  resize();
  for (let i = 0; i < MAX_FLARES; i++) flares.push(mkFlare());
  requestAnimationFrame(frame);

  // ── Grain ─────────────────────────────────────────────────
  let grainOn = true;
  const grainEl = document.getElementById('grain-cv');
  const grainCx = grainEl.getContext('2d');
  let grainImg = null;
  function drawGrainFrame() {
    if (!grainOn) return;
    const gW = Math.ceil(window.innerWidth  / 2);
    const gH = Math.ceil(window.innerHeight / 2);
    if (grainEl.width !== gW || grainEl.height !== gH) {
      grainEl.width = gW; grainEl.height = gH;
      grainImg = grainCx.createImageData(gW, gH);
    }
    const data = grainImg.data;
    for (let i = 0; i < data.length; i += 4) {
      const v = Math.random() * 255 | 0;
      data[i] = data[i+1] = data[i+2] = v;
      data[i+3] = Math.random() * 30 | 0;
    }
    grainCx.putImageData(grainImg, 0, 0);
    requestAnimationFrame(drawGrainFrame);
  }
  window.addEventListener('keydown', e => { if (e.key === 'g' || e.key === 'G') { grainOn = !grainOn; if (grainOn) drawGrainFrame(); } });
  drawGrainFrame();

  // ── Canvas click / T key ──────────────────────────────────
  canvas.addEventListener('click', triggerBurst);
  document.getElementById('tkey').addEventListener('click', triggerBurst);

  // ── Speed UI ──────────────────────────────────────────────
  function updateSpeedUI() {
    const sl = document.getElementById('slower');
    const fa = document.getElementById('faster');
    sl.style.opacity       = cycleMs >= 560 ? '0.4' : '1';
    sl.style.pointerEvents = cycleMs >= 560 ? 'none' : '';
    fa.style.opacity       = cycleMs <= 70  ? '0.4' : '1';
    fa.style.pointerEvents = cycleMs <= 70  ? 'none' : '';
  }
  updateSpeedUI();
  document.getElementById('slower').addEventListener('click', () => { cycleMs = Math.min(560, cycleMs + 140); updateSpeedUI(); });
  document.getElementById('faster').addEventListener('click', () => { cycleMs = Math.max(70,  cycleMs - 140); updateSpeedUI(); });

  // ── Legend ────────────────────────────────────────────────
  let cHeld = false;
  const legendEl = document.getElementById('legend');
  const opsEl    = document.getElementById('ops');
  const zkoEl    = document.getElementById('zko');
  const btn      = document.getElementById('btn');

  const legendSpans = VGA.map(col => {
    const s = document.createElement('span');
    s.style.color = col; s.style.cursor = 'pointer'; s.textContent = rc();
    s.addEventListener('click', () => {
      if (cHeld) {
        uiColorIdx = VGA.indexOf(col);
        btn.style.color  = col; opsEl.style.color = col; zkoEl.style.color = col;
        document.getElementById('ckey').style.color   = col;
        document.getElementById('speed').style.color  = col;
        document.getElementById('tgkeys').style.color = col;
      } else { lineColor = col; colorIdx = VGA.indexOf(col); }
    });
    legendEl.appendChild(s); return s;
  });

  zkoEl.textContent = rc()+rc()+rc()+rc();
  btn.textContent   = rb();
  opsEl.textContent = rc()+rc()+rc()+rc();

  setInterval(() => {
    zkoEl.textContent = rc()+rc()+rc()+rc();
    opsEl.textContent = rc()+rc()+rc()+rc();
    legendSpans.forEach(s => s.textContent = rc());
  }, 200);
  setInterval(() => { btn.textContent = rb(); }, 140);

  // ── Mic toggle ────────────────────────────────────────────
  btn.addEventListener('click', async () => {
    if (micActive) {
      micActive = false; btn.style.opacity = '0.4';
      micStream?.getTracks().forEach(t => t.stop());
      audioCtx?.close();
      micStream = audioCtx = analyser = timeDomain = null;
      ampLevel = 0; return;
    }
    try {
      micStream  = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      audioCtx   = new (window.AudioContext || window.webkitAudioContext)();
      const src  = audioCtx.createMediaStreamSource(micStream);
      analyser   = audioCtx.createAnalyser();
      analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.5;
      src.connect(analyser);
      timeDomain = new Uint8Array(analyser.fftSize);
      micActive  = true; btn.style.opacity = '';
    } catch {}
  });

  // ── Keyboard ──────────────────────────────────────────────
  window.addEventListener('keydown', e => {
    if (e.isTrusted) window.parent?.postMessage({ type: 'childKey', key: e.key, shiftKey: !!e.shiftKey }, '*');
    if (e.key === 't' || e.key === 'T') {
      triggerBurst();
    } else if (e.key === 'ArrowLeft' && !cHeld) {
      cycleMs = Math.min(560, cycleMs + 140); updateSpeedUI();
    } else if (e.key === 'ArrowRight' && !cHeld) {
      cycleMs = Math.max(70, cycleMs - 140); updateSpeedUI();
    } else if (!cHeld && e.key === 'ArrowUp') {
      colorIdx = (colorIdx - 1 + VGA.length) % VGA.length; lineColor = VGA[colorIdx];
    } else if (!cHeld && e.key === 'ArrowDown') {
      colorIdx = (colorIdx + 1) % VGA.length; lineColor = VGA[colorIdx];
    } else if (cHeld && e.key === 'ArrowUp') {
      uiColorIdx = (uiColorIdx - 1 + VGA.length) % VGA.length;
      btn.style.color = VGA[uiColorIdx]; opsEl.style.color = VGA[uiColorIdx]; zkoEl.style.color = VGA[uiColorIdx];
      document.getElementById('ckey').style.color   = VGA[uiColorIdx];
      document.getElementById('speed').style.color  = VGA[uiColorIdx];
      document.getElementById('tgkeys').style.color = VGA[uiColorIdx];
    } else if (cHeld && e.key === 'ArrowDown') {
      uiColorIdx = (uiColorIdx + 1) % VGA.length;
      btn.style.color = VGA[uiColorIdx]; opsEl.style.color = VGA[uiColorIdx]; zkoEl.style.color = VGA[uiColorIdx];
      document.getElementById('ckey').style.color   = VGA[uiColorIdx];
      document.getElementById('speed').style.color  = VGA[uiColorIdx];
      document.getElementById('tgkeys').style.color = VGA[uiColorIdx];
    } else if (e.key === 'c' || e.key === 'C') { cHeld = true; }
  });

  window.addEventListener('keyup', e => {
    if (e.isTrusted) window.parent?.postMessage({ type: 'childKeyup', key: e.key }, '*');
    if (e.key === 'c' || e.key === 'C') cHeld = false;
  });

  // ── postMessage bridge ────────────────────────────────────
  window.addEventListener('message', e => {
    if (e.data?.type === 'key') {
      if (e.data.cHeld !== undefined) cHeld = !!e.data.cHeld;
      window.dispatchEvent(new KeyboardEvent('keydown', { key: e.data.key, shiftKey: !!e.data.shiftKey, bubbles: true }));
    }
    else if (e.data?.type === 'keyup')
      window.dispatchEvent(new KeyboardEvent('keyup', { key: e.data.key, bubbles: true }));
    else if (e.data?.type === 'audioData')
      parentAudio = e.data;
  });

  // Randomize colors on load
  (function() {
    const GOOD = [6,11,13,14,15];
    colorIdx  = GOOD[Math.floor(Math.random() * GOOD.length)];
    lineColor = VGA[colorIdx];
    const _uiPool = GOOD.filter(i => i !== colorIdx);
    uiColorIdx = _uiPool[Math.floor(Math.random() * _uiPool.length)];
    const _uc = VGA[uiColorIdx];
    if (btn)   btn.style.color   = _uc;
    if (opsEl) opsEl.style.color = _uc;
    if (zkoEl) zkoEl.style.color = _uc;
    const _ck = document.getElementById('ckey');
    const _tk = document.getElementById('tgkeys');
    const _sp = document.getElementById('speed');
    if (_ck) _ck.style.color = _uc;
    if (_tk) _tk.style.color = _uc;
    if (_sp) _sp.style.color = _uc;
  })();
</script>
</body>
</html>
