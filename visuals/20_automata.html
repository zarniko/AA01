<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Automata</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Roboto Mono', monospace;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, #080808 0%, #000 70%);
    z-index: 0;
  }
  #canvas {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: block;
  }
  .scanline {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
    pointer-events: none;
    z-index: 2;
  }
  .vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    z-index: 3;
  }
  #btn {
    all: unset;
    position: fixed;
    top: 20px;
    left: 24px;
    z-index: 4;
    font-family: 'Roboto Mono', monospace;
    font-size: 14px;
    color: #39ff14;
    letter-spacing: 3px;
    cursor: pointer;
  }
  #legend {
    position: fixed;
    top: 20px;
    right: 24px;
    z-index: 4;
    font-family: 'Roboto Mono', monospace;
    font-size: 14px;
    display: grid;
    grid-template-columns: repeat(8, 1em);
    gap: 4px 6px;
    line-height: 1.4;
    text-align: center;
  }
  #zko {
    position: fixed;
    bottom: 20px;
    left: 24px;
    z-index: 4;
    font-family: 'Roboto Mono', monospace;
    font-size: 14px;
    letter-spacing: 3px;
    color: #39ff14;
    text-decoration: none;
    cursor: pointer;
  }
  #ops {
    position: fixed;
    bottom: 20px;
    right: 24px;
    z-index: 4;
    font-family: 'Roboto Mono', monospace;
    font-size: 14px;
    letter-spacing: 3px;
    color: #39ff14;
  }
  #speed {
    position: fixed;
    bottom: 40px;
    right: 24px;
    z-index: 4;
    font-family: 'Roboto Mono', monospace;
    font-size: 14px;
    letter-spacing: 3px;
    color: #39ff14;
    user-select: none;
  }
  #speed span { cursor: pointer; }
  #tgkeys {
    position: fixed;
    top: 54px;
    left: 24px;
    z-index: 4;
    font-family: 'Roboto Mono', monospace;
    font-size: 14px;
    letter-spacing: 3px;
    color: #39ff14;
    display: flex;
    gap: 1ch;
  }
  #tkey { cursor: pointer; }
  #grain-cv {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 5;
  }
  #ckey {
    position: fixed;
    top: 68px;
    right: 24px;
    width: 1em;
    z-index: 4;
    font-family: 'Roboto Mono', monospace;
    font-size: 14px;
    line-height: 1.4;
    color: #39ff14;
    text-align: center;
    pointer-events: none;
  }
  #dbg {
    position: fixed; bottom: 20px; left: 100px; z-index: 6;
    font-family: 'Roboto Mono', monospace; font-size: 14px;
    letter-spacing: 3px; color: #39ff14; pointer-events: none; white-space: nowrap;
  }
</style>
</head>
<body>
<div class="scanline"></div>
<div class="vignette"></div>
<button id="btn"></button>
<div id="tgkeys"><div id="tkey">T</div></div>
<div id="legend"></div>
<div id="ops"></div>
<div id="speed"><span id="slower">&lt;</span> <span id="faster">&gt;</span></div>
<div id="ckey">C</div>
<a id="zko" href="https://zko.io" target="_blank" rel="noopener"></a>
<canvas id="grain-cv"></canvas>
<canvas id="canvas"></canvas>
<script>
  const canvas  = document.getElementById('canvas');
  const ctx     = canvas.getContext('2d');

  let W, H, SUN_R, SUN_CX, SUN_CY;

  let _bgGrad;
  // Static background layer baked once per resize
  const _staticCv = document.createElement('canvas');
  const _staticCx = _staticCv.getContext('2d');

  function buildGradients() {
    _bgGrad = ctx.createRadialGradient(SUN_CX, SUN_CY, SUN_R*0.6, SUN_CX, SUN_CY, Math.max(W,H)*1.5);
    _bgGrad.addColorStop(0,'#0d0d0d'); _bgGrad.addColorStop(0.25,'#050505'); _bgGrad.addColorStop(1,'#000000');

    _staticCv.width = W; _staticCv.height = H;
    _staticCx.fillStyle = _bgGrad;
    _staticCx.fillRect(0, 0, W, H);
  }

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    SUN_R  = Math.min(W, H) * 0.302;
    SUN_CX = W / 2;
    SUN_CY = H * 0.5;
    buildGradients();
  }
  window.addEventListener('resize', resize);

  // ── Helpers ───────────────────────────────────────────────
  const POOL = '.,:;+*#@0123456789';
  const rc = () => POOL[Math.floor(Math.random() * POOL.length)];
  const rb = () => String.fromCodePoint(0x2801 + Math.floor(Math.random() * 255));

  const VGA = [
    '#000000','#0000AA','#00AA00','#00AAAA',
    '#AA0000','#AA00AA','#AA5500','#AAAAAA',
    '#555555','#5555FF','#55FF55','#55FFFF',
    '#FF5555','#FF55FF','#FFFF55','#FFFFFF',
  ];

  // Pre-cached trig constants
  const cosE  = Math.cos(0.38), sinE = Math.sin(0.38);

  // ── State ─────────────────────────────────────────────────
  let cycleMs    = 140;
  let lineColor  = '#FFFF55';
  let colorIdx   = 14;
  let uiColorIdx = 13;
  let ampLevel   = 0;
  let ampWasHigh = false;
  let sunAngle   = 0;
  let sphereRot  = 0;

  let crossBlink = 0;
  let sizePulse  = 0;   // beat-driven sphere size pulse (0..1)

  // ── Audio ─────────────────────────────────────────────────
  let micActive = false, micStream = null, audioCtx = null, analyser = null, timeDomain = null;
  let parentAudio = null;

  // ── Axis annotations ──────────────────────────────────────
  const axisMarks = [];
  const MAX_AXIS = 4;

  function projectSphere(lat, lng, rScale = 1) {
    const cLat = Math.cos(lat), sLat = Math.sin(lat);
    const cLng = Math.cos(lng), sLng = Math.sin(lng);
    const px = cLat * cLng;
    const py = -sLat * cosE + cLat * sLng * sinE;
    const z3 = cLat * sLng;
    const r  = SUN_R * rScale;
    return { x: SUN_CX + r * px, y: SUN_CY + r * py, px, py, z3 };
  }

  function strokeLatLngArcs(lat, lng, rScale, dLat, dLng, steps, clipFront) {
    ctx.beginPath();
    let started = false;
    for (let k = 0; k <= steps; k++) {
      const l = lng - dLng + (2 * dLng * k) / steps;
      const p = projectSphere(lat, l, rScale);
      if (clipFront && p.z3 < 0) { started = false; continue; }
      if (!started) { ctx.moveTo(p.x, p.y); started = true; }
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();

    const latMin = Math.max(-Math.PI / 2, lat - dLat);
    const latMax = Math.min(Math.PI / 2, lat + dLat);
    ctx.beginPath();
    started = false;
    for (let k = 0; k <= steps; k++) {
      const phi = latMin + ((latMax - latMin) * k) / steps;
      const p = projectSphere(phi, lng, rScale);
      if (clipFront && p.z3 < 0) { started = false; continue; }
      if (!started) { ctx.moveTo(p.x, p.y); started = true; }
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  }

  function mkAxisMark() {
    // Placed on the sphere's front-facing hemisphere in rotating local coords,
    // with rejection sampling to keep annotations spread apart and away from dead center.
    let lat = 0, lng = Math.PI / 2;
    for (let attempt = 0; attempt < 15; attempt++) {
      const candLat = (Math.random() - 0.5) * 1.5;
      const worldLng = 0.18 + Math.random() * (Math.PI - 0.75);
      const p = projectSphere(candLat, worldLng);
      if (p.px * p.px + p.py * p.py < 0.28 * 0.28) continue;
      let tooClose = false;
      for (const m of axisMarks) {
        const mp = projectSphere(m.lat, m.lng + sphereRot);
        const dx = p.x - mp.x, dy = p.y - mp.y;
        if (dx * dx + dy * dy < 100 * 100) { tooClose = true; break; }
      }
      lat = candLat;
      lng = worldLng - sphereRot;
      if (!tooClose) break;
    }
    return {
      lat, lng,
      label:   String(10 + Math.floor(Math.random() * 90)),
      born:    performance.now(),
      maxLife: 4000 + Math.random() * 7000,
    };
  }

  // ── Trigger ───────────────────────────────────────────────
  function triggerAxisFlash() {
    crossBlink = 1.0;
    sizePulse  = Math.max(sizePulse, 0.6);
    if (axisMarks.length) axisMarks[Math.floor(Math.random() * axisMarks.length)] = mkAxisMark();
  }

  // ── Render ────────────────────────────────────────────────
  let lastTs = null;

  // D: audio debug readout (rms, bass, avg, sd, dev, beat, amp) next to the zko link
  const _dbg = { rms: 0, b: 0, avg: 0, sd: 0, dev: 0, beat: 0 };
  let _dbgEl = null;
  window.addEventListener('keydown', e => {
    if ((e.key !== 'd' && e.key !== 'D') || e.metaKey || e.ctrlKey || e.altKey) return;
    if (_dbgEl) { _dbgEl.remove(); _dbgEl = null; return; }
    _dbgEl = document.createElement('div'); _dbgEl.id = 'dbg'; document.body.appendChild(_dbgEl);
    (function tick() {
      if (!_dbgEl) return;
      const z = document.getElementById('zko');
      _dbgEl.textContent = `${_dbg.rms.toFixed(3)} ${_dbg.b.toFixed(0)} ${_dbg.avg.toFixed(0)} ${_dbg.sd.toFixed(1)} ${_dbg.dev.toFixed(1)} ${_dbg.beat.toFixed(2)} ${(typeof ampLevel === 'number' ? ampLevel : 0).toFixed(2)}`;
      if (z && z.style.color) _dbgEl.style.color = z.style.color;
      requestAnimationFrame(tick);
    })();
  });

  // Bass-band beat detector (same as 32_julia): bass level vs its ~1s running mean, scaled by the music's own variation.
  // Level-invariant, so steady speaker->mic music still produces pulses. Returns 0..1.
  let _fBuf = null, _bAvg = -1, _bVar = 16, _bWarm = 0, _bLast = 0;
  function beatLevel() {
    let f, binHz;
    if (micActive && analyser) {
      if (!_fBuf || _fBuf.length !== analyser.frequencyBinCount) _fBuf = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(_fBuf); f = _fBuf; binHz = audioCtx.sampleRate / analyser.fftSize;
    } else if (parentAudio && parentAudio.freqData) {
      f = parentAudio.freqData; binHz = 24000 / f.length;
    } else { _bAvg = -1; return 0; }
    const now = performance.now();
    if (now - _bLast > 500) _bAvg = -1;     // stream (re)started
    _bLast = now;
    const lo = Math.max(1, Math.round(50 / binHz)), hi = Math.max(lo, Math.round(200 / binHz));
    let b = 0;
    for (let k = lo; k <= hi; k++) b += f[k];
    b /= (hi - lo + 1);
    if (_bAvg < 0) { _bAvg = b; _bVar = 16; _bWarm = 40; return 0; }   // warm-up skips analyser start-up ramp
    const dev = b - _bAvg;
    _bAvg += dev * 0.015;
    _bVar += (dev * dev - _bVar) * 0.015;
    if (_bWarm > 0) { _bWarm--; return 0; }
    const sd = Math.sqrt(_bVar);
    const _bt = Math.max(0, Math.min(1, (dev - Math.max(3, sd * 0.8)) / Math.max(8, sd * 1.7)));
    _dbg.b = b; _dbg.avg = _bAvg; _dbg.sd = sd; _dbg.dev = dev; _dbg.beat = _bt;
    return _bt;
  }

  function frame(ts) {
    if (!lastTs) { lastTs = ts; requestAnimationFrame(frame); return; }
    const elapsed = ts - lastTs;
    if (elapsed < 15) { requestAnimationFrame(frame); return; } // cap ~66fps, halves work on 120Hz
    const dt = Math.min(elapsed / 1000, 0.05);
    lastTs = ts;
    sphereRot += dt * 0.12;

    // Audio
    let beat = 0;
    if (micActive || parentAudio) {
      let rms;
      if (micActive) {
        analyser.getByteTimeDomainData(timeDomain);
        let sq = 0;
        for (let k = 0; k < timeDomain.length; k++) {
          const d = timeDomain[k] / 255 - 0.5; sq += d * d;
        }
        rms = Math.sqrt(sq / timeDomain.length);
      } else { rms = parentAudio.rms; }
      beat = beatLevel();
      rms = Math.max(rms, beat * 0.1);   // raw level (claps, loud tab audio) or beat pulse, whichever is larger
      _dbg.rms = rms;
      ampLevel += (rms * 5 - ampLevel) * 0.1;
      if (rms > 0.06 && !ampWasHigh) { triggerAxisFlash(); ampWasHigh = true; }
      else if (rms < 0.03) ampWasHigh = false;
    } else { ampLevel *= 0.95; }
    // Fast attack / slower release so the sphere snaps out on a beat and eases back
    sizePulse += (beat - sizePulse) * (beat > sizePulse ? 0.5 : 0.12);
    const sk = 1 + 0.09 * sizePulse;

    const speedMult = 140 / cycleMs;

    crossBlink *= 0.88;

    ctx.clearRect(0, 0, W, H);

    // Sphere, corona, grid and limb scale together about the sphere centre
    ctx.save();
    ctx.translate(SUN_CX, SUN_CY); ctx.scale(sk, sk); ctx.translate(-SUN_CX, -SUN_CY);

    // Background (pre-baked)
    ctx.drawImage(_staticCv, 0, 0);

    // Wireframe sphere (no solid 3D shading)
    ctx.save();
    ctx.lineWidth = 1.0;
    ctx.strokeStyle = '#aaaaaa';
    ctx.globalAlpha = 0.50;
    ctx.beginPath();
    ctx.arc(SUN_CX, SUN_CY, SUN_R, 0, Math.PI * 2);
    ctx.stroke();

    // Latitude rings (correct perspective ellipses for elevation 0.38 rad)
    ctx.lineWidth = 0.8;
    ctx.globalAlpha = 0.40;
    for (let i = 1; i <= 7; i++) {
      const phi = -Math.PI / 2 + i * Math.PI / 8;
      const lcy = SUN_CY - SUN_R * Math.sin(phi) * cosE;
      const lrx = SUN_R * Math.cos(phi);
      const lry = lrx * sinE;
      if (lry < 1) continue;
      ctx.beginPath();
      ctx.ellipse(SUN_CX, lcy, lrx, lry, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Longitude lines — full wireframe meridians, rotated with sphereRot
    ctx.globalAlpha = 0.35;
    for (let j = 0; j < 6; j++) {
      const lng  = j * Math.PI / 6;
      const lngS = lng + sphereRot;
      const cosL = Math.cos(lngS), sinL = Math.sin(lngS);
      ctx.beginPath();
      for (let k = 0; k <= 60; k++) {
        const t    = -Math.PI / 2 + k * Math.PI / 30;
        const cosT = Math.cos(t), sinT = Math.sin(t);
        const gx2d = SUN_CX + SUN_R * cosT * cosL;
        const gy2d = SUN_CY + SUN_R * (-sinT * cosE + cosT * sinL * sinE);
        if (k === 0) ctx.moveTo(gx2d, gy2d);
        else ctx.lineTo(gx2d, gy2d);
      }
      ctx.stroke();
    }

    ctx.globalAlpha = 1;
    ctx.restore();
    ctx.restore();   // end sphere scale transform

    // Axis mark lifecycle: prune expired, respawn up to cap
    const now = performance.now();
    for (let mi = axisMarks.length - 1; mi >= 0; mi--) {
      if ((now - axisMarks[mi].born) / axisMarks[mi].maxLife >= 1) axisMarks.splice(mi, 1);
    }
    while (axisMarks.length < MAX_AXIS) axisMarks.push(mkAxisMark());

    // Axis lines with surface lat/lng intersection arcs and tip labels
    ctx.save();
    ctx.font         = '14px "Roboto Mono", monospace';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle  = lineColor;
    ctx.fillStyle    = lineColor;
    ctx.shadowColor  = lineColor;
    ctx.lineDashOffset = -ts * 0.012;
    const ARC_SPAN = 0.55, ARC_STEPS = 18;
    for (const m of axisMarks) {
      const fLT = (now - m.born) / m.maxLife;
      if (fLT >= 1) continue;
      const lngS = m.lng + sphereRot;
      const limbFade = Math.max(0, Math.min(1, Math.sin(lngS) * 4));
      const fEnv = Math.min(1, fLT * 4) * Math.min(1, (1 - fLT) * 4) * limbFade;
      if (fEnv <= 0.01) continue;

      const tipScale = sk * 1.38 + 18 / SUN_R;
      const tipR     = SUN_R * tipScale;
      const p0   = projectSphere(m.lat, lngS, sk);
      const pEnd = projectSphere(m.lat, lngS, sk * 1.38);
      const pTip = projectSphere(m.lat, lngS, tipScale);
      const nLen = Math.hypot(p0.px, p0.py) || 1;
      const nx   = p0.px / nLen, ny = p0.py / nLen;
      const lblX = pTip.x + nx * 22, lblY = pTip.y + ny * 22;

      // Latitude & longitude arcs intersecting at the surface anchor point
      ctx.setLineDash([]);
      ctx.lineWidth   = 0.8;
      ctx.shadowBlur  = 5;
      ctx.globalAlpha = fEnv * 0.55;
      strokeLatLngArcs(m.lat, lngS, sk, ARC_SPAN, ARC_SPAN, ARC_STEPS, true);

      // Surface intersection dot
      ctx.shadowBlur  = 4;
      ctx.globalAlpha = fEnv * 0.85;
      ctx.beginPath();
      ctx.arc(p0.x, p0.y, 1.8, 0, Math.PI * 2);
      ctx.fill();

      // Dotted normal line emerging from the surface intersection
      ctx.setLineDash([5, 5]);
      ctx.lineWidth   = 0.7;
      ctx.shadowBlur  = 8;
      ctx.globalAlpha = fEnv * 0.70;
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(pEnd.x, pEnd.y);
      ctx.stroke();

      // Tip label & curved lat/lng cross
      ctx.shadowBlur  = 0;
      ctx.setLineDash([]);
      ctx.globalAlpha = fEnv * 0.85;
      ctx.fillText(m.label, lblX, lblY);

      ctx.lineWidth   = 1.5;
      ctx.shadowBlur  = 5;
      ctx.globalAlpha = fEnv * (0.62 + crossBlink * 0.38);
      const dLat = 10 / tipR;
      const dLng = 10 / (tipR * Math.max(0.25, Math.cos(m.lat)));
      strokeLatLngArcs(m.lat, lngS, tipScale, dLat, dLng, 6, false);
    }
    ctx.shadowBlur  = 0;
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    ctx.restore();

    drawGrainFrame(ts);
    requestAnimationFrame(frame);
  }

  // ── Init ──────────────────────────────────────────────────
  resize();
  for (let i = 0; i < MAX_AXIS; i++) axisMarks.push(mkAxisMark());
  requestAnimationFrame(frame);

  // ── Grain ─────────────────────────────────────────────────
  // Pre-baked: generate N frames once at startup, cycle with putImageData at 30fps.
  // Eliminates ~1M Math.random() calls/frame from the hot loop.
  let grainOn = true;
  const grainEl = document.getElementById('grain-cv');
  const grainCx = grainEl.getContext('2d');
  const GRAIN_N = 4;
  const _grainImgs = [];
  let _grainIdx = 0, _grainLastTs = 0;

  function prebakeGrain() {
    const gW = Math.ceil(window.innerWidth  / 2);
    const gH = Math.ceil(window.innerHeight / 2);
    grainEl.width = gW; grainEl.height = gH;
    _grainImgs.length = 0;
    for (let f = 0; f < GRAIN_N; f++) {
      const img = grainCx.createImageData(gW, gH);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        d[i] = d[i+1] = d[i+2] = Math.random() * 255 | 0;
        d[i+3] = Math.random() * 30 | 0;
      }
      _grainImgs.push(img);
    }
  }

  function drawGrainFrame(ts) {
    if (!grainOn) return;
    if (ts - _grainLastTs >= 33) { // 30fps cap — imperceptible vs 120fps
      grainCx.putImageData(_grainImgs[_grainIdx], 0, 0);
      _grainIdx = (_grainIdx + 1) % GRAIN_N;
      _grainLastTs = ts;
    }
  }

  window.addEventListener('resize', prebakeGrain);
  window.addEventListener('keydown', e => { if (e.key === 'g' || e.key === 'G') grainOn = !grainOn; });
  prebakeGrain();

  // ── Canvas click / T key ──────────────────────────────────
  canvas.addEventListener('click', triggerAxisFlash);
  document.getElementById('tkey').addEventListener('click', triggerAxisFlash);

  // ── Speed UI ──────────────────────────────────────────────
  function updateSpeedUI() {
    const sl = document.getElementById('slower');
    const fa = document.getElementById('faster');
    sl.style.opacity       = cycleMs >= 560 ? '0.4' : '1';
    sl.style.pointerEvents = cycleMs >= 560 ? 'none' : '';
    fa.style.opacity       = cycleMs <= 70  ? '0.4' : '1';
    fa.style.pointerEvents = cycleMs <= 70  ? 'none' : '';
  }
  updateSpeedUI();
  document.getElementById('slower').addEventListener('click', () => { cycleMs = Math.min(560, cycleMs + 140); updateSpeedUI(); });
  document.getElementById('faster').addEventListener('click', () => { cycleMs = Math.max(70,  cycleMs - 140); updateSpeedUI(); });

  // ── Legend ────────────────────────────────────────────────
  let cHeld = false;
  const legendEl = document.getElementById('legend');
  const opsEl    = document.getElementById('ops');
  const zkoEl    = document.getElementById('zko');
  const btn      = document.getElementById('btn');

  const legendSpans = VGA.map(col => {
    const s = document.createElement('span');
    s.style.color = col; s.style.cursor = 'pointer'; s.textContent = rc();
    s.addEventListener('click', () => {
      if (cHeld) {
        uiColorIdx = VGA.indexOf(col);
        btn.style.color  = col; opsEl.style.color = col; zkoEl.style.color = col;
        document.getElementById('ckey').style.color   = col;
        document.getElementById('speed').style.color  = col;
        document.getElementById('tgkeys').style.color = col;
      } else { lineColor = col; colorIdx = VGA.indexOf(col); }
    });
    legendEl.appendChild(s); return s;
  });

  zkoEl.textContent = rc()+rc()+rc()+rc();
  btn.textContent   = rb();
  opsEl.textContent = rc()+rc()+rc()+rc();

  setInterval(() => {
    zkoEl.textContent = rc()+rc()+rc()+rc();
    opsEl.textContent = rc()+rc()+rc()+rc();
    legendSpans.forEach(s => s.textContent = rc());
  }, 200);
  setInterval(() => { btn.textContent = rb(); }, 140);

  // ── Mic toggle ────────────────────────────────────────────
  btn.addEventListener('click', async () => {
    if (micActive) {
      micActive = false; btn.style.opacity = '0.4';
      micStream?.getTracks().forEach(t => t.stop());
      audioCtx?.close();
      micStream = audioCtx = analyser = timeDomain = null;
      ampLevel = 0; return;
    }
    try {
      micStream  = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false }, video: false });
      audioCtx   = new (window.AudioContext || window.webkitAudioContext)();
      const src  = audioCtx.createMediaStreamSource(micStream);
      analyser   = audioCtx.createAnalyser();
      analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.2;
      src.connect(analyser);
      timeDomain = new Uint8Array(analyser.fftSize);
      micActive  = true; btn.style.opacity = '';
    } catch {}
  });

  // ── Keyboard ──────────────────────────────────────────────
  window.addEventListener('keydown', e => {
    if (e.isTrusted) window.parent?.postMessage({ type: 'childKey', key: e.key, shiftKey: !!e.shiftKey }, '*');
    if (e.key === 't' || e.key === 'T') {
      triggerAxisFlash();
    } else if (e.key === 'ArrowLeft' && !cHeld) {
      cycleMs = Math.min(560, cycleMs + 140); updateSpeedUI();
    } else if (e.key === 'ArrowRight' && !cHeld) {
      cycleMs = Math.max(70, cycleMs - 140); updateSpeedUI();
    } else if (!cHeld && e.key === 'ArrowUp') {
      colorIdx = (colorIdx - 1 + VGA.length) % VGA.length; lineColor = VGA[colorIdx];
    } else if (!cHeld && e.key === 'ArrowDown') {
      colorIdx = (colorIdx + 1) % VGA.length; lineColor = VGA[colorIdx];
    } else if (cHeld && e.key === 'ArrowUp') {
      uiColorIdx = (uiColorIdx - 1 + VGA.length) % VGA.length;
      btn.style.color = VGA[uiColorIdx]; opsEl.style.color = VGA[uiColorIdx]; zkoEl.style.color = VGA[uiColorIdx];
      document.getElementById('ckey').style.color   = VGA[uiColorIdx];
      document.getElementById('speed').style.color  = VGA[uiColorIdx];
      document.getElementById('tgkeys').style.color = VGA[uiColorIdx];
    } else if (cHeld && e.key === 'ArrowDown') {
      uiColorIdx = (uiColorIdx + 1) % VGA.length;
      btn.style.color = VGA[uiColorIdx]; opsEl.style.color = VGA[uiColorIdx]; zkoEl.style.color = VGA[uiColorIdx];
      document.getElementById('ckey').style.color   = VGA[uiColorIdx];
      document.getElementById('speed').style.color  = VGA[uiColorIdx];
      document.getElementById('tgkeys').style.color = VGA[uiColorIdx];
    } else if (e.key === 'c' || e.key === 'C') { cHeld = true; }
  });

  window.addEventListener('keyup', e => {
    if (e.isTrusted) window.parent?.postMessage({ type: 'childKeyup', key: e.key }, '*');
    if (e.key === 'c' || e.key === 'C') cHeld = false;
  });

  // ── postMessage bridge ────────────────────────────────────
  window.addEventListener('message', e => {
    if (e.data?.type === 'key') {
      if (e.data.cHeld !== undefined) cHeld = !!e.data.cHeld;
      window.dispatchEvent(new KeyboardEvent('keydown', { key: e.data.key, shiftKey: !!e.data.shiftKey, bubbles: true }));
    }
    else if (e.data?.type === 'keyup')
      window.dispatchEvent(new KeyboardEvent('keyup', { key: e.data.key, bubbles: true }));
    else if (e.data?.type === 'audioData')
      parentAudio = e.data;
  });

  // Randomize colors on load
  (function() {
    const GOOD = [6,11,13,14,15];
    colorIdx  = GOOD[Math.floor(Math.random() * GOOD.length)];
    lineColor = VGA[colorIdx];
    const _uiPool = GOOD.filter(i => i !== colorIdx);
    uiColorIdx = _uiPool[Math.floor(Math.random() * _uiPool.length)];
    const _uc = VGA[uiColorIdx];
    if (btn)   btn.style.color   = _uc;
    if (opsEl) opsEl.style.color = _uc;
    if (zkoEl) zkoEl.style.color = _uc;
    const _ck = document.getElementById('ckey');
    const _tk = document.getElementById('tgkeys');
    const _sp = document.getElementById('speed');
    if (_ck) _ck.style.color = _uc;
    if (_tk) _tk.style.color = _uc;
    if (_sp) _sp.style.color = _uc;
  })();
</script>
</body>
</html>
