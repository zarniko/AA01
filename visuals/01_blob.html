<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blob</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Roboto Mono', monospace;
  }
  #canvas {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: block;
  }
  .scanline {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
    pointer-events: none;
    z-index: 2;
  }
  #btn {
    all: unset;
    position: fixed;
    top: 20px;
    left: 24px;
    z-index: 4;
    font-family: 'Roboto Mono', monospace;
    font-size: 14px;
    color: #39ff14;
    letter-spacing: 3px;
    cursor: pointer;
  }
  #grain-cv {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
  }
  #legend {
    position: fixed;
    top: 20px;
    right: 24px;
    z-index: 4;
    font-family: 'Roboto Mono', monospace;
    font-size: 14px;
    display: grid;
    grid-template-columns: repeat(8, 1em);
    gap: 4px 6px;
    line-height: 1.4;
    text-align: center;
  }
  #zko {
    position: fixed;
    bottom: 20px;
    left: 24px;
    z-index: 4;
    font-family: 'Roboto Mono', monospace;
    font-size: 14px;
    letter-spacing: 3px;
    color: #39ff14;
    text-decoration: none;
    cursor: pointer;
  }
  #ops {
    position: fixed;
    bottom: 20px;
    right: 24px;
    z-index: 4;
    font-family: 'Roboto Mono', monospace;
    font-size: 14px;
    letter-spacing: 3px;
    color: #39ff14;
  }
  #speed {
    position: fixed;
    bottom: 40px;
    right: 24px;
    z-index: 4;
    font-family: 'Roboto Mono', monospace;
    font-size: 14px;
    letter-spacing: 3px;
    color: #39ff14;
    user-select: none;
  }
  #speed span { cursor: pointer; }
  #tgkeys {
    position: fixed; top: 54px; left: 24px; z-index: 6;
    font-family: 'Roboto Mono', monospace; font-size: 14px;
    letter-spacing: 3px; color: #39ff14;
    display: flex; gap: 1ch;
  }
  #tkey { cursor: pointer; }
  #ckey {
    position: fixed;
    top: 68px;
    right: 24px;
    width: 1em;
    z-index: 4;
    font-family: 'Roboto Mono', monospace;
    font-size: 14px;
    line-height: 1.4;
    color: #39ff14;
    text-align: center;
    pointer-events: none;
  }
  #dbg {
    position: fixed; bottom: 20px; left: 100px; z-index: 6;
    font-family: 'Roboto Mono', monospace; font-size: 14px;
    letter-spacing: 3px; color: #39ff14; pointer-events: none; white-space: nowrap;
  }
</style>
</head>
<body>
<div class="scanline"></div>
<button id="btn"></button>
<div id="tgkeys"><div id="tkey">T</div></div>
<canvas id="grain-cv"></canvas>
<div id="legend"></div>
<div id="ops"></div>
<div id="speed"><span id="slower">&lt;</span> <span id="faster">&gt;</span></div>
<div id="ckey">C</div>
<a id="zko" href="https://zko.io" target="_blank" rel="noopener"></a>
<canvas id="canvas"></canvas>
<script>
  const canvas = document.getElementById('canvas');
  const ctx    = canvas.getContext('2d');

  let W, H;

  // Low-res offscreen canvas — rendered at 1/RES, scaled up for free smoothing blur
  const lowCv  = document.createElement('canvas');
  const lowCtx = lowCv.getContext('2d');
  const RES    = 8;
  let   imgData = null;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
    lowCv.width  = Math.ceil(W / RES);
    lowCv.height = Math.ceil(H / RES);
    imgData = null;
  }
  resize();
  window.addEventListener('resize', resize);

  // ── Circular blob state (restrained tint + organic harmonic rim) ─
  let tintR = 0.33, tintG = 0.85, tintB = 0.95;
  let targR = 0.33, targG = 0.85, targB = 0.95;
  let colorIdx = 11;

  function setBlobTint(r, g, b) {
    targR = r / 255;
    targG = g / 255;
    targB = b / 255;
  }

  let t           = 0;
  let driftRate   = 0.014; // base harmonic phase speed
  let pulseTarget = 0;
  let ampSmooth   = 0;

  // ── Audio ─────────────────────────────────────────────────
  let analyser = null, timeDomain = null;
  let micActive = false, micStream = null, audioCtx = null;
  let ampLevel = 0, speedBump = 0;
  let parentAudio = null;

  // ── Render loop ───────────────────────────────────────────
  // D: audio debug readout (rms, bass, avg, sd, dev, beat, amp) next to the zko link
  const _dbg = { rms: 0, b: 0, avg: 0, sd: 0, dev: 0, beat: 0 };
  let _dbgEl = null;
  window.addEventListener('keydown', e => {
    if ((e.key !== 'd' && e.key !== 'D') || e.metaKey || e.ctrlKey || e.altKey) return;
    if (_dbgEl) { _dbgEl.remove(); _dbgEl = null; return; }
    _dbgEl = document.createElement('div'); _dbgEl.id = 'dbg'; document.body.appendChild(_dbgEl);
    (function tick() {
      if (!_dbgEl) return;
      const z = document.getElementById('zko');
      _dbgEl.textContent = `${_dbg.rms.toFixed(3)} ${_dbg.b.toFixed(0)} ${_dbg.avg.toFixed(0)} ${_dbg.sd.toFixed(1)} ${_dbg.dev.toFixed(1)} ${_dbg.beat.toFixed(2)} ${(typeof ampLevel === 'number' ? ampLevel : 0).toFixed(2)}`;
      if (z && z.style.color) _dbgEl.style.color = z.style.color;
      requestAnimationFrame(tick);
    })();
  });

  // Bass-band beat detector (same as 32_julia): bass level vs its ~1s running mean, scaled by the music's own variation.
  // Level-invariant, so steady speaker->mic music still produces pulses. Returns 0..1.
  let _fBuf = null, _bAvg = -1, _bVar = 16, _bWarm = 0, _bLast = 0;
  function beatLevel() {
    let f, binHz;
    if (micActive && analyser) {
      if (!_fBuf || _fBuf.length !== analyser.frequencyBinCount) _fBuf = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(_fBuf); f = _fBuf; binHz = audioCtx.sampleRate / analyser.fftSize;
    } else if (parentAudio && parentAudio.freqData) {
      f = parentAudio.freqData; binHz = 24000 / f.length;
    } else { _bAvg = -1; return 0; }
    const now = performance.now();
    if (now - _bLast > 500) _bAvg = -1;     // stream (re)started
    _bLast = now;
    const lo = Math.max(1, Math.round(50 / binHz)), hi = Math.max(lo, Math.round(200 / binHz));
    let b = 0;
    for (let k = lo; k <= hi; k++) b += f[k];
    b /= (hi - lo + 1);
    if (_bAvg < 0) { _bAvg = b; _bVar = 16; _bWarm = 40; return 0; }   // warm-up skips analyser start-up ramp
    const dev = b - _bAvg;
    _bAvg += dev * 0.015;
    _bVar += (dev * dev - _bVar) * 0.015;
    if (_bWarm > 0) { _bWarm--; return 0; }
    const sd = Math.sqrt(_bVar);
    const _bt = Math.max(0, Math.min(1, (dev - Math.max(3, sd * 0.8)) / Math.max(8, sd * 1.7)));
    _dbg.b = b; _dbg.avg = _bAvg; _dbg.sd = sd; _dbg.dev = dev; _dbg.beat = _bt;
    return _bt;
  }

  function blobWobble(ang, tt, amp) {
    return 1
      + (0.10 + amp * 0.06) * Math.sin(2 * ang + tt * 0.85)
      + (0.07 + amp * 0.05) * Math.cos(3 * ang - tt * 0.65)
      + (0.04 + amp * 0.03) * Math.sin(5 * ang + tt * 1.15);
  }

  let _lastFrameTs = 0;
  function frame(ts = 0) {
    requestAnimationFrame(frame);
    if (ts - _lastFrameTs < 20) return;
    _lastFrameTs = ts;

    const lowW = lowCv.width;
    const lowH = lowCv.height;

    // Audio RMS → ampLevel and organic swell
    if (micActive || parentAudio) {
      let rms;
      if (micActive) {
        analyser.getByteTimeDomainData(timeDomain);
        let sq = 0;
        for (let k = 0; k < timeDomain.length; k++) {
          const d = timeDomain[k] / 255 - 0.5;
          sq += d * d;
        }
        rms = Math.sqrt(sq / timeDomain.length);
      } else { rms = parentAudio.rms; }
      rms = Math.max(rms, beatLevel() * 0.1);
      _dbg.rms = rms;
      ampLevel += (rms * 5 - ampLevel) * 0.15;
      if (rms > 0.06) speedBump = Math.max(speedBump, rms * 0.10);
    } else {
      ampLevel *= 0.92;
    }
    speedBump   *= 0.94;
    pulseTarget *= 0.982;
    const rawLv  = Math.min(1.1, Math.max(ampLevel, pulseTarget));
    ampSmooth   += (rawLv - ampSmooth) * (rawLv > ampSmooth ? 0.05 : 0.025);

    t += (driftRate + speedBump) * (1 + ampSmooth * 1.2);

    // Smoothly morph tint toward target
    tintR += (targR - tintR) * 0.04;
    tintG += (targG - tintG) * 0.04;
    tintB += (targB - tintB) * 0.04;

    const cx = lowW * 0.5, cy = lowH * 0.5;
    const R0 = Math.min(lowW, lowH) * (0.25 + ampSmooth * 0.065);
    const invR0 = 1 / R0;

    if (!imgData || imgData.width !== lowW || imgData.height !== lowH) {
      imgData = lowCtx.createImageData(lowW, lowH);
    }
    const data = imgData.data;
    data.fill(0);

    for (let j = 0; j < lowH; j++) {
      const dy = (j - cy) * invR0;
      const dy2 = dy * dy;
      if (dy2 > 3.6) continue;

      for (let i = 0; i < lowW; i++) {
        const dx = (i - cx) * invR0;
        const r2 = dx * dx + dy2;
        if (r2 > 3.6) continue;

        const r   = Math.sqrt(r2);
        const ang = Math.atan2(dy, dx);
        const wob = blobWobble(ang, t, ampSmooth);
        const rn  = r / wob;
        if (rn > 1.75) continue;

        // Circular blob profile: soft inner depth + luminous rim + outer mist
        const rimD  = (rn - 0.80) * 4.4;
        const bRim  = Math.exp(-rimD * rimD) * 0.62;
        const bCore = Math.exp(-rn * rn * 1.55) * 0.48;
        const bMist = Math.exp(-rn * rn * 0.85) * 0.16;
        const shim  = 0.11 * Math.sin(dx * 3.1 + t * 0.9) * Math.cos(dy * 3.1 - t * 0.7);
        const b0    = Math.min(0.84, Math.max(0, (bCore + bRim + bMist) * (0.76 + ampSmooth * 0.28) * (1 + shim)));
        const b     = b0 * (0.72 + 0.28 * b0);
        if (b < 0.004) continue;

        // Restrained, less-colorful palette: moody silver-slate core + subtle tinted rim dispersion
        const rimW = Math.min(1, bRim * 1.45);
        const disp = 0.09 * Math.sin(ang * 2 - t * 0.5);
        const rC   = (0.64 + disp) * (1 - rimW * 0.55) + tintR * (rimW * 0.55);
        const gC   = (0.67)        * (1 - rimW * 0.55) + tintG * (rimW * 0.55);
        const bC   = (0.74 - disp) * (1 - rimW * 0.55) + tintB * (rimW * 0.55);

        const idx     = (j * lowW + i) * 4;
        data[idx]     = (rC * b * 255) | 0;
        data[idx + 1] = (gC * b * 255) | 0;
        data[idx + 2] = (bC * b * 255) | 0;
        data[idx + 3] = 255;
      }
    }

    lowCtx.putImageData(imgData, 0, 0);

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'medium';
    ctx.drawImage(lowCv, 0, 0, W, H);

    drawBlobAnnotations(R0 * RES);
    drawGrainFrame(ts);
  }

  function drawBlobAnnotations(baseR) {
    const col = VGA[uiColorIdx] || '#39ff14';
    const cx  = W * 0.5, cy = H * 0.5;
    ctx.save();
    ctx.strokeStyle  = col;
    ctx.fillStyle    = col;
    ctx.shadowColor  = col;
    ctx.font         = '11px "Roboto Mono", monospace';
    ctx.textBaseline = 'middle';

    const angles = [
      -0.65 + 0.08 * Math.sin(t * 0.35),
       1.45 + 0.08 * Math.cos(t * 0.28),
       2.65 + 0.08 * Math.sin(t * 0.31 + 1.2),
    ];

    for (let k = 0; k < angles.length; k++) {
      const ang = angles[k];
      const wob = blobWobble(ang, t, ampSmooth);
      const rPx = baseR * wob * 0.84;
      const ax  = cx + Math.cos(ang) * rPx;
      const ay  = cy + Math.sin(ang) * rPx;

      // Small curved rim arc hugging the blob boundary at this angle
      ctx.setLineDash([]);
      ctx.lineWidth   = 0.85;
      ctx.shadowBlur  = 4;
      ctx.globalAlpha = 0.52 + ampSmooth * 0.25;
      ctx.beginPath();
      for (let s = -6; s <= 6; s++) {
        const a2 = ang + s * 0.032;
        const r2 = baseR * blobWobble(a2, t, ampSmooth) * 0.84;
        const px = cx + Math.cos(a2) * r2;
        const py = cy + Math.sin(a2) * r2;
        if (s === -6) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();

      // Anchor dot on rim
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.arc(ax, ay, 2.0, 0, Math.PI * 2);
      ctx.fill();

      // Dotted radial leader line
      const lead = 36 + ampSmooth * 14;
      const tx   = Math.max(70, Math.min(W - 70, ax + Math.cos(ang) * lead));
      const ty   = Math.max(40, Math.min(H - 40, ay + Math.sin(ang) * lead));
      ctx.setLineDash([4, 5]);
      ctx.lineDashOffset = -t * 14;
      ctx.lineWidth   = 0.8;
      ctx.globalAlpha = 0.58 + ampSmooth * 0.22;
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(tx, ty);
      ctx.stroke();

      // Tip cross
      ctx.setLineDash([]);
      ctx.lineWidth   = 1.1;
      ctx.globalAlpha = 0.76;
      ctx.beginPath();
      ctx.moveTo(tx - 5, ty); ctx.lineTo(tx + 5, ty);
      ctx.moveTo(tx, ty - 5); ctx.lineTo(tx, ty + 5);
      ctx.stroke();

      // Compact single-line polar math annotation
      const rightSide = Math.cos(ang) >= 0;
      const inward    = (rightSide && tx > W - 150) || (!rightSide && tx < 150);
      const alignLeft = inward ? !rightSide : rightSide;
      ctx.textAlign   = alignLeft ? 'left' : 'right';
      const lxTxt     = tx + (alignLeft ? 10 : -10);
      ctx.shadowBlur  = 0;
      ctx.globalAlpha = 0.76;
      const label = k === 0
        ? `r ${wob.toFixed(2)}  θ ${ang.toFixed(2)}`
        : k === 1
        ? `δ ${(wob - 1).toFixed(2)}  ω ${(driftRate * 60).toFixed(2)}`
        : `σ ${(0.25 + ampSmooth * 0.065).toFixed(2)}  a ${ampSmooth.toFixed(2)}`;
      ctx.fillText(label, lxTxt, ty);
    }

    ctx.restore();
  }

  function triggerBlob() {
    pulseTarget = Math.min(1.1, Math.max(pulseTarget, 0.35) + 0.45);
    speedBump   = Math.max(speedBump, 0.015);
  }

  // ── Grain (pre-baked 4 frames, cycled at 30fps) ───────────
  let grainOn  = true;
  const grainEl = document.getElementById('grain-cv');
  const grainCx = grainEl.getContext('2d');
  const GRAIN_N = 4;
  const _grainImgs = [];
  let _grainIdx = 0, _grainLastTs = 0;

  function prebakeGrain() {
    const gW = Math.ceil(window.innerWidth  / 2);
    const gH = Math.ceil(window.innerHeight / 2);
    grainEl.width  = gW;
    grainEl.height = gH;
    _grainImgs.length = 0;
    for (let f = 0; f < GRAIN_N; f++) {
      const img = grainCx.createImageData(gW, gH);
      const data = img.data;
      for (let i = 0; i < data.length; i += 4) {
        const v = Math.random() * 255 | 0;
        data[i] = data[i+1] = data[i+2] = v;
        data[i+3] = Math.random() * 30 | 0;
      }
      _grainImgs.push(img);
    }
  }
  function drawGrainFrame(ts = 0) {
    if (!grainOn || !_grainImgs.length) return;
    if (ts - _grainLastTs >= 33) {
      grainCx.putImageData(_grainImgs[_grainIdx], 0, 0);
      _grainIdx = (_grainIdx + 1) % GRAIN_N;
      _grainLastTs = ts;
    }
  }
  function toggleGrain() {
    grainOn = !grainOn;
    if (!grainOn) grainCx.clearRect(0, 0, grainEl.width, grainEl.height);
  }
  window.addEventListener('resize', prebakeGrain);
  window.addEventListener('keydown', e => { if (e.key === 'g' || e.key === 'G') toggleGrain(); });
  canvas.addEventListener('click', triggerBlob);
  document.getElementById('tkey').addEventListener('click', triggerBlob);
  prebakeGrain();
  requestAnimationFrame(frame);

  // ── Mic toggle ────────────────────────────────────────────
  const btn = document.getElementById('btn');
  btn.addEventListener('click', async () => {
    if (micActive) {
      micActive = false;
      btn.style.opacity = '0.4';
      micStream?.getTracks().forEach(t => t.stop());
      audioCtx?.close();
      micStream = audioCtx = analyser = timeDomain = null;
      ampLevel = 0;
      return;
    }
    try {
      micStream  = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false }, video: false });
      audioCtx   = new (window.AudioContext || window.webkitAudioContext)();
      const src  = audioCtx.createMediaStreamSource(micStream);
      analyser   = audioCtx.createAnalyser();
      analyser.fftSize               = 2048;
      analyser.smoothingTimeConstant = 0.2;
      src.connect(analyser);
      timeDomain = new Uint8Array(analyser.fftSize);
      micActive  = true;
      btn.style.opacity = '';
    } catch { /* permission denied */ }
  });

  // ── C-key modifier ────────────────────────────────────────
  let cHeld = false;
  let uiColorIdx = 10;
  window.addEventListener('keyup',   e => { if (e.isTrusted) window.parent?.postMessage({ type: 'childKeyup', key: e.key }, '*'); if (e.key==='c'||e.key==='C') cHeld=false; });

  // ── VGA 16-color legend ───────────────────────────────────
  // Regular click → morph next blob toward that color
  // C + click    → change UI chrome color
  const POOL   = '.,:;+*#@0123456789';
  const PRIMES = ['2','3','5','7','11','13','17','19','/'];
  const rc = () => POOL[Math.floor(Math.random() * POOL.length)];
  const rb = () => String.fromCodePoint(0x2801 + Math.floor(Math.random() * 255));
  const rp = () => PRIMES[Math.floor(Math.random() * PRIMES.length)];
  const VGA = [
    '#000000','#0000AA','#00AA00','#00AAAA',
    '#AA0000','#AA00AA','#AA5500','#AAAAAA',
    '#555555','#5555FF','#55FF55','#55FFFF',
    '#FF5555','#FF55FF','#FFFF55','#FFFFFF',
  ];

  function hexToRgb(hex) {
    return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
  }

  const legendEl    = document.getElementById('legend');
  const legendSpans = VGA.map(col => {
    const s = document.createElement('span');
    s.style.color  = col;
    s.style.cursor = 'pointer';
    s.textContent  = rc();
    s.addEventListener('click', () => {
      if (cHeld) {
        btn.style.color  = col;
        opsEl.style.color = col;
        zkoEl.style.color = col;
        document.getElementById('ckey').style.color   = col;
        document.getElementById('tgkeys').style.color = col;
        document.getElementById('speed').style.color  = col;
      } else {
        const [r, g, b] = hexToRgb(col);
        setBlobTint(r, g, b);
      }
    });
    legendEl.appendChild(s);
    return s;
  });

  const zkoEl = document.getElementById('zko');
  zkoEl.textContent = rc()+rc()+rc()+rc();
  btn.textContent   = rb();
  const opsEl = document.getElementById('ops');
  opsEl.textContent = rp()+rp();

  let cycleMs = 140;
  function cycleFn() {
    btn.textContent   = rb();
    opsEl.textContent = rp()+rp();
    zkoEl.textContent = rc()+rc()+rc()+rc();
    legendSpans.forEach(s => s.textContent = rc());
  }
  let cycleId = setInterval(cycleFn, cycleMs);

  function updateSpeedUI() {
    const sl = document.getElementById('slower');
    const fa = document.getElementById('faster');
    sl.style.opacity       = cycleMs >= 560 ? '0.4' : '1';
    sl.style.pointerEvents = cycleMs >= 560 ? 'none' : '';
    fa.style.opacity       = cycleMs <= 140 ? '0.4' : '1';
    fa.style.pointerEvents = cycleMs <= 140 ? 'none' : '';
  }
  updateSpeedUI();

  document.getElementById('slower').addEventListener('click', () => {
    cycleMs = Math.min(560, cycleMs + 140);
    clearInterval(cycleId); cycleId = setInterval(cycleFn, cycleMs); updateSpeedUI();
  });
  document.getElementById('faster').addEventListener('click', () => {
    cycleMs = Math.max(140, cycleMs - 140);
    clearInterval(cycleId); cycleId = setInterval(cycleFn, cycleMs); updateSpeedUI();
  });

  window.addEventListener('keydown', e => {
    if (e.isTrusted) window.parent?.postMessage({ type: 'childKey', key: e.key, shiftKey: !!e.shiftKey }, '*');
    if (e.key === 'c' || e.key === 'C') { cHeld = true; return; }
    if (e.key === 't' || e.key === 'T') { triggerBlob(); return; }
    if      (e.key === 'ArrowLeft'  && !cHeld) {
      cycleMs = Math.min(560, cycleMs + 140);
      clearInterval(cycleId); cycleId = setInterval(cycleFn, cycleMs); updateSpeedUI();
    } else if (e.key === 'ArrowRight' && !cHeld) {
      cycleMs = Math.max(140, cycleMs - 140);
      clearInterval(cycleId); cycleId = setInterval(cycleFn, cycleMs); updateSpeedUI();
    } else if (cHeld && e.key === 'ArrowLeft') {
      // Slow blob drift
      driftRate = Math.max(0.002, driftRate - 0.002);
    } else if (cHeld && e.key === 'ArrowRight') {
      // Speed up blob drift
      driftRate = Math.min(0.030, driftRate + 0.002);
    } else if (!cHeld && e.key === 'ArrowUp') {
      colorIdx = (colorIdx - 1 + VGA.length) % VGA.length;
      const [r, g, b] = hexToRgb(VGA[colorIdx]);
      setBlobTint(r, g, b);
    } else if (!cHeld && e.key === 'ArrowDown') {
      colorIdx = (colorIdx + 1) % VGA.length;
      const [r, g, b] = hexToRgb(VGA[colorIdx]);
      setBlobTint(r, g, b);
    } else if (cHeld && e.key === 'ArrowUp') {
      uiColorIdx = (uiColorIdx - 1 + VGA.length) % VGA.length;
      btn.style.color   = VGA[uiColorIdx];
      opsEl.style.color = VGA[uiColorIdx];
      zkoEl.style.color = VGA[uiColorIdx];
      document.getElementById('ckey').style.color   = VGA[uiColorIdx];
      document.getElementById('tgkeys').style.color = VGA[uiColorIdx];
      document.getElementById('speed').style.color  = VGA[uiColorIdx];
    } else if (cHeld && e.key === 'ArrowDown') {
      uiColorIdx = (uiColorIdx + 1) % VGA.length;
      btn.style.color   = VGA[uiColorIdx];
      opsEl.style.color = VGA[uiColorIdx];
      zkoEl.style.color = VGA[uiColorIdx];
      document.getElementById('ckey').style.color   = VGA[uiColorIdx];
      document.getElementById('tgkeys').style.color = VGA[uiColorIdx];
      document.getElementById('speed').style.color  = VGA[uiColorIdx];
    }
  });

  // ── postMessage bridge (keyboard from parent window) ──────────
  window.addEventListener('message', e => {
    if (e.data?.type === 'key') {
      if (e.data.cHeld !== undefined) cHeld = !!e.data.cHeld;
      window.dispatchEvent(new KeyboardEvent('keydown', {key:e.data.key, shiftKey:!!e.data.shiftKey, bubbles:true}));
    }
    else if (e.data?.type === 'keyup')
      window.dispatchEvent(new KeyboardEvent('keyup', {key:e.data.key, bubbles:true}));
    else if (e.data?.type === 'audioData')
      parentAudio = e.data;
  });

  // Randomize colors on load
  (function() {
    const TINT_POOL = [6, 9, 11, 12, 13, 14];
    const GOOD      = [6, 11, 13, 14, 15];
    colorIdx  = TINT_POOL[Math.floor(Math.random() * TINT_POOL.length)];
    const [r, g, b] = hexToRgb(VGA[colorIdx]);
    setBlobTint(r, g, b);
    tintR = targR; tintG = targG; tintB = targB;
    const _uiPool = GOOD.filter(i => i !== colorIdx);
    uiColorIdx = _uiPool[Math.floor(Math.random() * _uiPool.length)];
    const _uc = VGA[uiColorIdx];
    if (btn)   btn.style.color   = _uc;
    if (opsEl) opsEl.style.color = _uc;
    if (zkoEl) zkoEl.style.color = _uc;
    const _ck = document.getElementById('ckey');
    const _tk = document.getElementById('tgkeys');
    const _sp = document.getElementById('speed');
    if (_ck) _ck.style.color = _uc;
    if (_tk) _tk.style.color = _uc;
    if (_sp) _sp.style.color = _uc;
  })();
</script>
